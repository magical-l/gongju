<!--
	C-Input 智能输入框组件
	支持单行和多行输入的自动适配。
	始终使用 PrimeVue Textarea 组件，通过动态调整 rows 属性实现单行/多行效果。
	参数：（注意在html里要把驼峰名变成短横线连接的名字）
		v-model：略
		placeholder：占位符文本
		minRows：最小行数，默认为1（单行效果）
		maxRows：最大行数，默认为10
		autoResize：是否自动调整高度，默认为true
		maxLength：最大字符长度限制
		multilineThreshold：内容长度阈值，超过此字符数时显示为多行，默认为50
		resizable：控制是否允许用户手动调整大小以及是否自动调整高度。可选值：'no'（不自动调整，不能手动调整），'auto'（自动调整，不能手动调整），'manual'（不自动调整，能手动调整），'yes'（自动调整，能手动调整）。默认为'yes'。
-->
<template id="c-input-template">
	<p-textarea v-model="internalValue" ref="textarea"
							:placeholder="placeholder"
							:size="size" :variant="variant" :disabled="disabled"
							:invalid="invalid"
							:rows="minRows"
							:auto-resize="isAutoResizeEffectivelyOn"
							:style="textareaStyle"
							@mousedown="onMouseDown">
	</p-textarea>
</template>

<style>
	.c-input-container {
		display: inline-block;
		width: 100%;
	}

	.c-input-container .p-textarea {
		width: 100%;
		min-height: 2.5em;
	}
</style>

<script>
	const CInput = {
		template: '#c-input-template',
		components: {
			'p-textarea': PrimeVue.Textarea
		},
		props: {
			modelValue: [String, Number],
			placeholder: {type: String, default: ''},
			minRows: {type: Number, default: 1},
			resizable: {type: String, default: 'yes'}, // 'yes', 'auto', 'manual', 'none'
			size: {type: String, default: null},
			variant: {type: String, default: 'outlined'},
			invalid: {type: Boolean, default: false},
			disabled: {type: Boolean, default: false}
		},
		data() {
			return {
				isDragging: false,
				manualHeight: null,
				hasBeenResized: false,
				startY: 0,
				startHeight: 0,
				originalOverflow: '' // 用于存储原始 overflow 样式
			};
		},
		emits: ['update:modelValue'],
		computed: {
			internalValue: {
				get() {
					return this.modelValue || '';
				},
				set(newValue) {
					this.$emit('update:modelValue', newValue);
					if (this.hasBeenResized && !this.isDragging) {
						this.$nextTick(this.adjustHeight);
					}
				}
			},
			isAutoResizeEffectivelyOn() {
				// 核心修复：拖拽时完全禁用自动调整高度
				return !this.isDragging && (this.resizable === 'yes' || this.resizable === 'auto') && !this.hasBeenResized;
			},
			textareaStyle() {
				const style = {};
				if (this.resizable === 'yes' || this.resizable === 'manual') {
					style.resize = 'vertical';
				} else {
					style.resize = 'none';
				}

				if (this.manualHeight) {
					style.minHeight = `${this.manualHeight}px`;
				}

				// 拖拽期间固定高度
				if (this.isDragging && this.$refs.textarea) {
					style.height = `${this.manualHeight}px`;
					style.overflow = 'hidden'; // 防止内容影响高度计算
				}

				return style;
			}
		},
		methods: {
			onMouseDown(event) {
				if (this.resizable === 'yes' && this.isResizeHandle(event)) {
					this.isDragging = true;
					const textarea = this.$refs.textarea.$el;

					// 存储原始状态
					this.originalOverflow = textarea.style.overflow;
					this.startY = event.clientY;
					this.startHeight = textarea.clientHeight;
					this.manualHeight = this.startHeight; // 初始化拖拽高度

					window.addEventListener('mousemove', this.onDragMove);
					window.addEventListener('mouseup', this.onDragEnd, {once: true});
				}
			},
			onDragMove(event) {
				if (this.isDragging) {
					const newHeight = this.startHeight + (event.clientY - this.startY);

					// 核心修复：直接设置高度并锁定
					this.manualHeight = Math.max(this.minRows * 20, newHeight); // 确保不低于最小高度
				}
			},
			onDragEnd(event) {
				if (this.isDragging) {
					this.isDragging = false;
					window.removeEventListener('mousemove', this.onDragMove);
					this.hasBeenResized = true;

					const textarea = this.$refs.textarea.$el;
					textarea.style.overflow = this.originalOverflow; // 恢复原始 overflow

					// 确保高度与内容匹配
					this.$nextTick(() => {
						if (textarea.scrollHeight > this.manualHeight) {
							this.manualHeight = textarea.scrollHeight;
						}
					});
				}
			},
			adjustHeight() {
				if (this.isDragging || !this.$refs.textarea) return;

				const textarea = this.$refs.textarea.$el;
				const contentHeight = textarea.scrollHeight;

				// 仅在内容高度大于当前高度时调整
				if (contentHeight > textarea.clientHeight) {
					this.manualHeight = contentHeight;
				}
			},
			isResizeHandle(event) {
				const el = event.target;
				return event.offsetY > el.clientHeight - 16 && event.offsetX > el.clientWidth - 16;
			}
		},
		watch: {
			resizable() {
				this.manualHeight = null;
				this.isDragging = false;
				this.hasBeenResized = false;
			}
		},
		beforeUnmount() {
			window.removeEventListener('mouseup', this.onDragEnd);
			window.removeEventListener('mousemove', this.onDragMove);
		}
	};

	if (typeof window !== 'undefined') {
		window.customComponents = window.customComponents || {};
		window.customComponents.CInput = CInput;
	}
</script>

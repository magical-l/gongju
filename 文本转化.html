<body>
<main>
	<header>
		<nav>
			<a href="文本转化.html" class="active">文本转化</a>
			<a href="数字转化.html">数字转化</a>

	<section class="input area">
		<p-textarea placeholder="在此输入要处理的文本" rows="5" autoResize
								v-model="inputText" @input="processInput"></p-textarea>
	</section>

	<section class="result area">
		<header>
			点击文本即可复制
		</header>
		<card class="one result" @click="copyToClipboard(result.value)" v-for="(result,label) in results" :key="label">
			<template #title>
				<header>
					<span>{{ label }}</span>
					<span>
						<choose-group class="chooser" v-for="(setting,settingName) in result.settings" :key="settingName"
													v-model="setting.val" :options="setting.options"
													@click.stop @change="updateResult(result, inputText)"/>
					</span>
				</header>
			</template>
			<template #content>
				<article title="点击复制" v-if="result.value">
					<span class="value">{{result.value}}</span>
					<p-button title="把此结果作为输入" aria-label="把此结果作为输入" @click.stop="asInput(result.value)"
										variant="outlined" serverity="info">
						<i class="pi pi-upload"></i>
					</p-button>
				</article>
				<div v-else class="placeholder">（等待输入）</div>
			</template>
		</card>
	</section>

<div>
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script src="https://unpkg.com/primevue/umd/primevue.min.js"></script>
	<script src="https://unpkg.com/@primeuix/themes/umd/aura.js"></script>
	<script src="lib/jquery-3.4.1.min.js"></script>
	<script src="lib/toastr.min.js"></script>
	<script src="resources/util.js"></script>
	<script src="resources/biz-util.js"></script>
	<script src="resources/ue.js"></script>
	<script src="resources/math.js"></script>
	<script src="lib/base64.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/js-md5@0.8.3/src/md5.min.js"></script>
</div>
<script>
	const {createApp} = Vue;

	const results = {
		'MD5': {
			value: '',
			convert: md5
		},
		'Base64编码': {
			value: '',
			convert: Base64.encode
		},
		'Base64解码': {
			value: '',
			convert: str => {
				try {
					return Base64.decode(str)
				} catch (e) {
					return '非Base64编码';
				}
			}
		},
		'URI编码': {
			value: '',
			convert: encodeURI
		},
		'URI解码': {
			value: '',
			convert: decodeURI
		},
		'URI参数编码': {
			value: '',
			convert: encodeURIComponent
		},
		'URI参数解码': {
			value: '',
			convert: decodeURIComponent
		}
	};

	const app = createApp({
		components: {
			'choose-group': PrimeVue.SelectButton,
			'p-button': PrimeVue.Button,
			'p-textarea': PrimeVue.Textarea,
			'p-fieldset': PrimeVue.Fieldset,
			'card': PrimeVue.Card,
			'toolbar': PrimeVue.Toolbar,
			'p-checkbox': PrimeVue.Checkbox
		},
		data() {
			return {
				inputText: '',
				results
			};
		},
		methods: {
			async copyToClipboard(text) {
				if (!text) {
					return;
				}
				try {
					await navigator.clipboard.writeText(text);
				} catch (err) {
					const textArea = document.createElement('textarea');
					textArea.value = text;
					document.body.appendChild(textArea);
					textArea.select();
					document.execCommand('copy');
					document.body.removeChild(textArea);
				}
				toastr.success('已复制到剪贴板');
			},
			processInput() {
				Object.values(this.results).forEach(result => {
					this.updateResult(result, this.inputText);
				});
			},
			updateResult(result, inputText) {
				if (inputText) {
					try {
						result.value = result.convert.call(result, inputText);
					} catch (e) {
						console.error(`Error processing result:`, e);
						result.value = '转换出错';
					}
				} else {
					result.value = '';
				}
			},
			asInput(val) {
				this.inputText = val;
				this.processInput();
			}
		},
		mounted() {
			this.processInput();
		}
	})
	.use(PrimeVue.Config, {
		theme: {
			preset: PrimeUIX.Themes.Aura
		}
	})
	.mount('main');
</script>

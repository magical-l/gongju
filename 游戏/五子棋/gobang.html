<main class="flex items-near-center-x">
	<article class="game wrapper , 反叵字形 grid" v-cloak>
		<div class="toolbar">
			<el-button v-if="!isGaming" type="primary" size="large" @click="startGame">开始新游戏</el-button>
			<el-button v-else type="danger" size="large" @click="restartGame">重新开始</el-button>
		</div>

		<div v-if="isGaming && curPlayer" class="game-info">
			当前玩家: {{ curPlayer.name }}
		</div>

		<div class="one chessboard" v-if="flatPositions.length">
			<div v-for="wrapper in flatPositions" :key="wrapper.position.toString()"
				 class="cell"
				 :class="[{ hoverable: isGaming && !isGameOver && !wrapper.unit }, currentPlayerColorClass]"
				 @click="handleCellClick(wrapper.position)">
				<!-- 棋子渲染在 cell 内部 -->
				<div v-if="wrapper.unit" class="unit piece display" :class="getUnitColor(wrapper.unit)">
					<span class="piece move-number">{{ wrapper.unit.moveNumber }}</span>
					<div v-if="lastMove && lastMove.position.isEqualTo(wrapper.position)" class="piece last-move-marker"></div>
				</div>
			</div>
		</div>

		<el-dialog v-model="isGameOver" title="游戏结束" width="300px" align-center>
			<div style="text-align: center; font-size: 24px;">
				<span>{{ winnerName }} 获胜!</span>
				<div v-if="isGaming && curPlayer" class="game-info">
					当前玩家: {{ curPlayer.name }}
				</div>
			</div>
			<template #footer>
				<el-button type="primary" @click="restartGame">再来一局</el-button>
			</template>

<script type="module">
	import {Gobang} from './gobang.esm.js';

	const {createApp, ref, computed, nextTick} = Vue;

	const app = createApp({
		data() {
			return {
				gaming: null,
				positions: [], //二维数组
				flatPositions: [], // 1D array of wrapper objects { position: 棋盘点位, unit: Unit }
				lastMove: null,
				curPlayer: null,
				isGameOver: false,
				winnerName: '',
			};
		},
		computed: {
			isGaming() {
				return !!this.gaming;
			},
			currentPlayerColorClass() {
				if (!this.curPlayer) {
					return '';
				}
				return this.curPlayer.team.id === '黑方' ? 'player-black-hover' : 'player-white-hover';
			},
		},
		methods: {
			startGame() {
				const game = new Gobang();
				this.gaming = game.newGaming();
				this.isGameOver = false;
				this.winnerName = '';
				this.lastMove = null;

				this.positions = this.gaming.battlefield.positions;
				this.flatPositions = this.positions.flat().map(pos => ({position: pos, unit: null}));

				this.curPlayer = this.gaming.situation.curPlayer;

				this.gaming.bulletin.watch('playerTurn start', ({player}) => this.curPlayer = player);

				this.gaming.bulletin.watch('buildUnit end', ({unit}) => {
					this.lastMove = {unit, position: unit.position};
					this.syncBoardState();
				});

				this.gaming.bulletin.watch('game over', ({winner}) => {
					this.isGameOver = true;
					this.winnerName = winner.name;
				});

				this.syncBoardState();
			},
			restartGame() {
				this.startGame();
			},
			syncBoardState() {
				if (!this.gaming) {
					return;
				}
				this.flatPositions.forEach(wrapper => {
					const unitsAtPos = this.gaming.battlefield.getUnitsAt(wrapper.position);
					wrapper.unit = unitsAtPos.length > 0 ? unitsAtPos[0] : null;
				});
			},
			handleCellClick(position) {
				if (this.isGaming && !this.isGameOver) {
					this.gaming.bulletin.notice('ui input', position);
				}
			},
			getUnitColor(unit) {
				return unit.owner.team.id === '黑方' ? 'player-black' : 'player-white';
			},
		},
	});

	app.use(ElementPlus);
	for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
		app.component(key, component);
	}
	window.app = app.mount('main>article');

</script>

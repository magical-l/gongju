<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>详细测试结果</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
    .passed { background-color: #d4edda; border: 1px solid #c3e6cb; }
    .failed { background-color: #f8d7da; border: 1px solid #f5c6cb; }
    .test-name { font-weight: bold; }
    .test-message { margin-top: 5px; }
  </style>
</head>
<body>
  <h1>五子棋详细测试结果</h1>
  <div id="results"></div>
  <script>
    // 创建一个简单的HTTP服务器来查看测试结果
    fetch('./测试结果/gobang-test-result.json')
      .then(response => response.json())
      .then(data => {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = `
          <h2>测试汇总</h2>
          <p>通过: ${data.passed}</p>
          <p>失败: ${data.failed}</p>
          <p>总计: ${data.total}</p>
          <p>运行时间: ${data.runtime} ms</p>
          
          <h2>详细测试结果</h2>
          ${data.testResults.map(test => `
            <div class="test-result ${test.failed > 0 ? 'failed' : 'passed'}">
              <div class="test-name">${test.name}</div>
              <div class="test-stats">通过: ${test.passed}, 失败: ${test.failed}, 总计: ${test.total}</div>
            </div>
          `).join('')}
        `;
      })
      .catch(error => {
        console.error('Error loading test results:', error);
        document.getElementById('results').innerHTML = '<p>无法加载测试结果</p>';
      });
  </script>
</body>
</html>

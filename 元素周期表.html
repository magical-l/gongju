<html lang="zh-CN" itemscope itemtype="http://schema.org/WebPage">
<head>
	<meta charset="UTF-8">
	<title itemprop="name">元素周期表 | 工具兽</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<style>
		body > main {
			padding: 0;
		}

		.element.periodic.table.full-width {
			height: 720px;
			grid-template-columns: 10px repeat(32, 1fr);
			grid-template-rows: repeat(7, 1fr);
		}

		.element.periodic.table.half-width {
			height: 720px;
			grid-template-columns: 10px repeat(18, 1fr);
			grid-template-rows: repeat(9, 1fr);
		}

		.周期序号 {
			grid-column: 1;
			border: 1px solid #ccc;
		}

		.周期1 {grid-row: 1;}

		.周期2 {grid-row: 2;}

		.周期3 {grid-row: 3;}

		.周期4 {grid-row: 4;}

		.周期5 {grid-row: 5;}

		.周期6 {grid-row: 6;}

		.周期7 {grid-row: 7;}

		.half-width .周期7 {grid-row-start: 8;}

		.half-width .周期6.周期序号, .half-width .周期7.周期序号 {
			grid-row-end: span 2;
		}

		.one.element {
			position: relative;
			border: 1px solid #ccc;
			background-color: #ccc; /* 默认颜色 */
			display: flex;
			flex-direction: column;
			transition: opacity 0.2s ease-in-out;
		}

		.element.info {
			height: 100%
		}

		.element.info > header {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.element.info p {
			margin: 0;
			padding: 1px 2px;
			line-height: 1.2;
		}

		.element.periodic.table {
			display: grid;
		}

		.half-width .镧系, .half-width .锕系 {
			grid-row-end: span 2;
			justify-content: end;
		}

		.half-width .镧系 .element.info, .half-width .锕系 .element.info {
			height: 50%; /* 否则占不满一行的格子 */
		}

		.half-width #镧, .half-width #锕 {
			clip-path: polygon(0% 100%, 100% 100%, 100% 40%, 50% 20%, 0% 40%);
		}

		.碱金属.element { background-color: #ffadad; }

		.碱土金属.element { background-color: #ffd6a5; }

		.过渡金属.element { background-color: #fdffb6; }

		.镧系.element { background-color: #caffbf; }

		.锕系.element { background-color: #9bf6ff; }

		.类金属.element { background-color: #a0c4ff; }

		.贫金属.element { background-color: #bdb2ff; }

		.活泼非金属.element { background-color: #ffc6ff; }

		.稀有气体.element { background-color: #f1f1f1; }

		.dangerous { color: #d32f2f; }

		.element.info {
			display: flex;
			flex-direction: column;
			height: 100%;
		}

		.element.name {
			flex-grow: 1;
			display: flex;
			justify-content: center;
			align-items: center;
			font-size: 1.6em;
			padding: 0;
		}

		.element > footer {
			display: flex;
			justify-content: flex-end;
			align-items: center;
			gap: 4px;
			padding: 0 4px 2px;
			height: 16px;
		}

		.element > footer > i {
			font-style: normal;
			font-size: 12px;
			line-height: 1;
		}

		.element > footer > i[title='铁磁性'] {font-size: 0.9em;}

		.element > footer > i[title='稀土元素'] {font-size: 1em;}

		.half-width .element > footer {
			justify-content: space-around; /* 分散对齐图标 */
			align-items: center;
			height: 24px; /* 增加页脚高度 */
		}

		.half-width .element > footer > i {font-size: 18px;}

		/* --- 筛选高亮样式 --- */
		.dimmed {
			opacity: 0.3;
		}

		.highlight {
			opacity: 1;
		}
	</style>
</head>
<body class="目字形">
<main>
	<toolbar>
		<template #start>
			<choose-group v-model="layoutMode" :options="layoutOptions" option-label="label" option-value="value"
										variant="outlined"/>
		</template>
		<template #center>
			<choose-group v-model="selectedTags" :options="filterableTags" multiple/>
		</template>
	</toolbar>
	<article class="periodic table of chemical element" :class="layout">
		<section v-for="n in 7" :key="n" class="周期序号" :class="`周期`+n">
			<p>{{n}}</p>
		</section>
		<section :id="element.name" class="one element"
						 :class="[...element.tags, `周期`+element.period, getHighlightClass(element)]"
						 :style="getElementStyle(element)"
						 v-for="element in elements" :key="element.id">
			<div class="element info">
				<header>
					<p class="element id">{{element.id}}</p>
					<p class="element symbol">{{element.symbol}}</p>
				</header>
				<p class="element name">{{element.name}}</p>
				<footer>
					<i v-if="element.tags.includes('放射性元素')" title="放射性元素" class="dangerous">☢</i>
					<i v-if="element.tags.includes('铁磁性')" title="铁磁性">🧲</i>
					<i v-if="element.tags.includes('人造元素')" title="人造元素">🧪</i>
					<i v-if="element.tags.includes('稀土元素')" title="稀土元素">💎</i>
					<i v-if="element.tags.includes('贵金属')" title="贵金属">💰</i>
				</footer>
			</div>
		</section>
	</article>
</main>

			// 'p-textarea': PrimeVue.Textarea,
			// 'p-fieldset': PrimeVue.Fieldset,
			// 'card': PrimeVue.Card,
			'toolbar': PrimeVue.Toolbar
			// 'p-checkbox': PrimeVue.Checkbox
		},
		data() {
			return {
				elements,
				layout: 'full-width',
				layoutMode: 'auto',
				layoutOptions: [
					{label: '宽版', value: 'wide'},
					{label: '窄版', value: 'narrow'},
					{label: '自动', value: 'auto'}
				],
				selectedTags: []
			};
		},
		computed: {
			filterableTags() {
				const allTags = this.elements.flatMap(el => el.tags || []);
				return [...new Set(allTags)].sort();
			}
		},
		watch: {
			layoutMode(newMode) {
				if (newMode === 'wide') {
					this.layout = 'full-width';
				} else if (newMode === 'narrow') {
					this.layout = 'half-width';
				} else {
					this.checkLayout();
				}
			}
		},
		methods: {
			getHighlightClass(element) {
				if (this.selectedTags.length === 0) {
					return {};
				}
				const hasActiveTag = element.tags.some(tag => this.selectedTags.includes(tag));
				return {
					'highlight': hasActiveTag,
					'dimmed': !hasActiveTag
				};
			},
			checkLayout() {
				if (this.layoutMode !== 'auto') {
					return;
				}
				const threshold = 2500;
				if (window.innerWidth < threshold) {
					this.layout = 'half-width';
				} else {
					this.layout = 'full-width';
				}
			},
			getElementStyle(element) {
				return {
					'grid-column': element.col > 0 ? element.col + 1 : element.col - 1
				};
			}
		},
		mounted() {
			this.checkLayout();
			window.addEventListener('resize', this.checkLayout);
		},
		beforeUnmount() {
			window.removeEventListener('resize', this.checkLayout);
		}
	})

		}

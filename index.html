<div class="js container">
	<script>
	(function (doc) {
		'use strict';

		var chips = doc.querySelectorAll('.cat.chip');
		var cards = doc.querySelectorAll('.tool.card');

		function onPick(chip) {
			var cat = chip.dataset.cat;
			chips.forEach(function (c) { c.classList.toggle('on', c === chip); });
			cards.forEach(function (card) {
				card.classList.toggle('off', cat !== '全部' && card.dataset.cat !== cat);
			});
		}

		chips.forEach(function (chip) {
			chip.addEventListener('click', function () { onPick(chip); });
		});
	})(document);
	</script>

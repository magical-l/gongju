		transition: all 0.5s;

	}

<main>
	<header>
		<h2>点灯游戏</h2>
		<el-button size="small" circle title="显示说明" @click="descriptionVisible = true">?</el-button>
	</header>
	<el-dialog title="页面说明" v-model="descriptionVisible" width="60%">
		<article class="description">
			<p>
				点击任意格子，它和相邻的格子都会切换颜色。<br>
				目标是将所有格子变成<b>蓝色</b>。
			</p>
			<p>这个游戏也被称为Lights Out，由Tiger Electronics在1995年推出。</p>
		</article>
	</el-dialog>

	<article>
		<section class="toolbar flex near-center">
			<el-radio-group v-model="boardSize">
				<el-radio-button v-for="opt in boardSizes" :key="opt" size="large" :value="opt">{{opt}}x{{opt}}
				</el-radio-button>
			</el-radio-group>
			<el-button @click="initGame" type="primary" size="large">重新开始</el-button>
			<el-button @click="giveHint" size="large">提示</el-button>
		</section>

		<section class="gaming">
			<section class="score board">
				<p class="moves">移动次数: <span>{{ moveCount }}</span></p>
				<p class="win-message" :class="{ show: isWin }">恭喜你赢了！</p>
			</section>

			<section class="map" :style="{gridTemplateColumns: `repeat(${boardSize}, 1fr)`}">
				<template v-for="(row, rowIndex) in board" :key="rowIndex">
					<div class="cell" :class="cell ? 'b' : 'a'"
							 v-for="(cell, colIndex) in row" :key="colIndex"
							 ref="cells"
							 @click="handleCellClick(rowIndex, colIndex)">
					</div>
				</template>
			</section>
		</section>
	</article>
</main>

<script src="../lib/vue/3.5.18/vue.global.js"></script>
<script src="../lib/element-plus/2.10.7/index.full.js"></script>
<script>
	const {createApp} = Vue;

	const app = createApp({
		data() {
			return {
				boardSizes: [3, 5, 7],
				boardSize: 5,
				board: [],
				moveCount: 0,
				descriptionVisible: false,
			};
		},
		computed: {
			isWin() {
				if (!this.board || this.board.length === 0) {
					return false;
				}
				return this.board.flat().every(cell => cell === true);
			}
		},
		watch: {
			boardSize: 'initGame'
		},
		methods: {
			initGame() {
				this.moveCount = 0;
				this.board = Array(this.boardSize).fill(0).map(() => Array(this.boardSize).fill(false));
			},
			toggleCellState(row, col) {
				if (this.board[row] && this.board[row][col] !== undefined) {
					this.board[row][col] = !this.board[row][col];
				}
			},
			handleCellClick(row, col) {
				if (this.isWin) {
					return;
				}
				this.toggleCellState(row, col);
				if (row > 0) this.toggleCellState(row - 1, col);
				if (row < this.boardSize - 1) this.toggleCellState(row + 1, col);
				if (col > 0) this.toggleCellState(row, col - 1);
				if (col < this.boardSize - 1) this.toggleCellState(row, col + 1);

				this.moveCount++;
			},
			giveHint() {
				if (this.isWin) {
					return;
				}
				const row = Math.floor(Math.random() * this.boardSize);
				const col = Math.floor(Math.random() * this.boardSize);
				const index = row * this.boardSize + col;
				const cell = this.$refs.cells[index];

				if (cell) {
					cell.style.boxShadow = '0 0 15px 5px gold';
					cell.style.transform = 'scale(1.1)';
					setTimeout(() => {
						cell.style.boxShadow = '';
						cell.style.transform = '';
					}, 1000);
				}
			}
		},
		mounted() {
			this.initGame();
		}
	})
	.use(ElementPlus)
	.mount('main');
</script>
</body>

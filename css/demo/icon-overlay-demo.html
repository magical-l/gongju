<!DOCTYPE html>
<html lang="zh" class="thin-scrollbar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图标 Overlay Demo</title>
<link rel="stylesheet" href="../common.css">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e8ecf0;
    padding: 1rem;
  }

  .demo-card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,.08);
    padding: 2rem 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    max-width: 580px;
    width: 100%;
  }

  .preview-area {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    background: #f5f7fa;
    border-radius: 14px;
    padding: 1.5rem;
  }
  .preview-icon {
    --icon-width: 80px;
    --icon-height: 80px;
    --icon-max-width: 80px;
    --icon-max-height: 80px;
    --icon-font-size: 48px;
    flex-shrink: 0;
    outline: 2px dashed #ccc;
    outline-offset: 2px;
    border-radius: 6px;
  }
  .preview-label {
    font-size: 0.85em;
    color: #888;
    font-family: monospace;
  }

  /* Overlay 字符通过 data 属性选择，CSS 变量自动处理 text/emoji 切换 */
  .preview-icon[data-overlay="cross"] { --icon-overlay-char: var(--char-cross); --icon-overlay-color: #d32f2f; }
  .preview-icon[data-overlay="warn"]  { --icon-overlay-char: var(--char-warning); --icon-overlay-color: #e68a00; }
  .preview-icon[data-overlay="check"] { --icon-overlay-char: var(--char-check); --icon-overlay-color: #2e7d32; }
  .preview-icon[data-overlay="star"]  { --icon-overlay-char: var(--char-star); --icon-overlay-color: #c68c00; }

  .control-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 1rem;
  }
  .knob {
    display: flex;
    align-items: center;
    gap: 0.4em;
    font-size: 0.75em;
    color: #555;
  }
  .knob label { min-width: 2.8em; }
  .knob input[type=range] {
    width: 80px;
    margin: 0;
    accent-color: #4a90d9;
  }
  .knob .val {
    min-width: 2.2em;
    text-align: right;
    font-family: monospace;
    color: #888;
  }

  .section-label {
    font-size: 0.8em;
    font-weight: 600;
    color: #555;
    margin-bottom: 0.4em;
  }
  .icon-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    max-height: 160px;
    overflow-y: auto;
    padding: 3px;
  }
  .icon-grid label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    cursor: pointer;
    background: #f5f7fa;
    border: 2px solid transparent;
    transition: .12s;
  }
  .icon-grid label:hover { background: #eef1f5; }
  .icon-grid label:has(input:checked) {
    border-color: #4a90d9;
    background: #e3edfc;
    box-shadow: 0 1px 4px rgba(74,144,217,.2);
  }
  .icon-cell {
    --icon-width: 24px;
    --icon-height: 24px;
    --icon-max-width: 24px;
    --icon-max-height: 24px;
    --icon-font-size: 15px;
  }
  .icon-grid input { display: none; }

  .overlay-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .overlay-bar label {
    display: inline-flex;
    align-items: center;
    gap: 0.35em;
    font-size: 0.85em;
    cursor: pointer;
    padding: 0.3em 0.7em;
    border-radius: 8px;
    border: 1.5px solid #ddd;
    transition: .12s;
    user-select: none;
  }
  .overlay-bar label:hover { border-color: #bbb; }
  .overlay-bar label:has(input:checked) {
    border-color: #999;
    background: #f0f2f5;
  }
  .overlay-bar input { display: none; }

  .info-bar {
    font-size: 0.8em;
    color: #aaa;
    text-align: center;
    font-family: monospace;
  }
  .mode-toggle {
    display: flex;
    align-items: center;
    gap: 0.5em;
    font-size: 0.8em;
    color: #666;
    cursor: pointer;
  }
  .mode-toggle input { accent-color: #4a90d9; }
</style>
</head>
<body>

<div class="demo-card">
  <div class="preview-area">
    <span id="previewIcon" class="char-style icon preview-icon : eye"></span>
    <div style="display:flex;flex-direction:column;gap:0.4rem;align-items:flex-start">
      <div id="iconLabel" class="preview-label">.eye</div>
      <label class="mode-toggle">
        <input type="checkbox" id="emojiToggle"> emoji 模式
      </label>
    </div>
  </div>

  <div>
    <div class="section-label">::before（底色图标）</div>
    <div class="control-row">
      <span class="knob"><label>X</label><input type="range" id="bfX" min="-50" max="50" value="0"><span class="val" id="bfXv">0</span></span>
      <span class="knob"><label>Y</label><input type="range" id="bfY" min="-50" max="50" value="0"><span class="val" id="bfYv">0</span></span>
      <span class="knob"><label>字号</label><input type="range" id="bfSize" min="20" max="70" value="48"><span class="val" id="bfSizev">48</span></span>
    </div>
  </div>

  <div>
    <div class="section-label">::after（叠加符）</div>
    <div class="control-row">
      <span class="knob"><label>X</label><input type="range" id="afX" min="-50" max="50" value="35"><span class="val" id="afXv">35</span></span>
      <span class="knob"><label>Y</label><input type="range" id="afY" min="-50" max="50" value="30"><span class="val" id="afYv">30</span></span>
      <span class="knob"><label>字号</label><input type="range" id="afSize" min="20" max="80" value="65"><span class="val" id="afSizev">65</span></span>
    </div>
  </div>

  <div>
    <div class="section-label">Overlay 字符</div>
    <div class="overlay-bar">
      <label><input type="radio" name="overlay" value="" checked> 无</label>
      <label style="color:#d32f2f"><input type="radio" name="overlay" value="cross"> ✗ 禁止</label>
      <label style="color:#e68a00"><input type="radio" name="overlay" value="warn"> ⚠ 警告</label>
      <label style="color:#2e7d32"><input type="radio" name="overlay" value="check"> ✓ 通过</label>
      <label style="color:#c68c00"><input type="radio" name="overlay" value="star"> ★ 星标</label>
    </div>
  </div>

  <div>
    <div class="section-label">图标</div>
    <div id="iconGrid" class="icon-grid"></div>
  </div>

  <div id="infoBar" class="info-bar">—</div>
</div>

<script>
const ICONS = [
  'eye', 'duplicate', 'chat', 'folder',
  'link', 'attach', 'file', 'drag',
  'settings', 'menu', 'star', 'edit', 'close', 'trash',
  'plus', 'minus', 'stop', 'copy',
  'go-top', 'go-bottom', 'up', 'down',
  'sun', 'moon',
  'palette', 'chart', 'digits',
  'done', 'cancel', 'warning', 'info', 'help',
];

const OVERLAY_NAMES = { cross: '✗', warn: '⚠', check: '✓', star: '★' };

const preview = document.getElementById('previewIcon');
const label = document.getElementById('iconLabel');
const grid = document.getElementById('iconGrid');
const emojiToggle = document.getElementById('emojiToggle');
const infoBar = document.getElementById('infoBar');

const bfX = document.getElementById('bfX');
const bfY = document.getElementById('bfY');
const bfSize = document.getElementById('bfSize');
const afX = document.getElementById('afX');
const afY = document.getElementById('afY');
const afSize = document.getElementById('afSize');

let current = 'eye';

function render(name) {
  preview.className = 'char-style icon preview-icon';
  preview.style.removeProperty('--icon-offset-x');
  preview.style.removeProperty('--icon-offset-y');
  preview.style.removeProperty('--icon-font-size');
  preview.style.removeProperty('--icon-overlay-font-size');
  preview.style.removeProperty('--icon-overlay-x');
  preview.style.removeProperty('--icon-overlay-y');
  preview.removeAttribute('data-overlay');

  if (emojiToggle.checked) preview.classList.add('emoji');

  // ::before 位置/字号
  preview.style.setProperty('--icon-offset-x', `${bfX.value}%`);
  preview.style.setProperty('--icon-offset-y', `${bfY.value}%`);
  preview.style.setProperty('--icon-font-size', `${bfSize.value}px`);

  // ::after 选择（用 data-overlay 驱动 CSS 变量）
  const ov = document.querySelector('input[name="overlay"]:checked')?.value;
  if (ov) {
    preview.dataset.overlay = ov;
    preview.style.setProperty('--icon-overlay-x', `${afX.value}%`);
    preview.style.setProperty('--icon-overlay-y', `${afY.value}%`);
    preview.style.setProperty('--icon-overlay-font-size', `${afSize.value / 100}em`);
  }

  preview.classList.add(name);
  current = name;
  label.textContent = `.${name}`;
  updateInfo();
}

function updateInfo() {
  const ov = document.querySelector('input[name="overlay"]:checked')?.value || '';
  const ovChar = OVERLAY_NAMES[ov] || '';
  infoBar.textContent =
    `.${current}${ov ? ' + ' + ovChar : ''}` +
    `  |  ::before X${bfX.value} Y${bfY.value} ${bfSize.value}px` +
    `  |  ::after X${afX.value} Y${afY.value} ${afSize.value}%`;
}

// 构建图标网格
for (const name of ICONS) {
  const el = document.createElement('label');
  el.title = name;
  const radio = document.createElement('input');
  radio.type = 'radio';
  radio.name = 'icon';
  radio.value = name;
  if (name === 'eye') radio.checked = true;
  radio.addEventListener('change', () => { if (radio.checked) render(name); });
  const cell = document.createElement('span');
  cell.className = name === 'folder' ? 'char-style icon icon-cell folder when-open' : `char-style icon icon-cell ${name}`;
  el.appendChild(radio);
  el.appendChild(cell);
  grid.appendChild(el);
}

// half-light
const hlWrap = document.createElement('label');
hlWrap.title = 'half-light';
const hlRadio = document.createElement('input');
hlRadio.type = 'radio';
hlRadio.name = 'icon';
hlRadio.value = 'half-light';
hlRadio.addEventListener('change', () => { if (hlRadio.checked) render('half-light'); });
const hlCell = document.createElement('span');
hlCell.className = 'char-style icon icon-cell half-light at-left';
hlWrap.appendChild(hlRadio);
hlWrap.appendChild(hlCell);
grid.appendChild(hlWrap);

// 事件
const allSliders = [bfX, bfY, bfSize, afX, afY, afSize];
allSliders.forEach(s => {
  s.addEventListener('input', () => { document.getElementById(s.id + 'v').textContent = s.value; render(current); });
});
document.querySelectorAll('input[name="overlay"]').forEach(r => {
  r.addEventListener('change', () => render(current));
});
emojiToggle.addEventListener('change', () => render(current));

render('eye');
</script>

</body>
</html>

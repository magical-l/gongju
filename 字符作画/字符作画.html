    <main>
        <header>
            <h2 class="page-lv name">字符作画</h2>
            <div class="page-lv help area">
                <button class="btn shape circle" id="helpBtn" title="显示说明">?</button>
            </div>
        </header>
        <div class="toolbar" id="topToolbar">
            <div class="one group">
                <button class="btn" id="newSceneBtn">✨ 新建</button>
                <button class="btn" id="saveSceneBtn">💾 保存</button>
                <button class="btn" id="loadSceneBtn">📂 打开</button>
                <button class="btn" id="canvasSettingsBtn">🖼️ 画布</button>
            </div>
            <div class="one group">
                <button class="btn" id="undoBtn" title="撤销 (Ctrl+Z)">↩️</button>
                <button class="btn" id="redoBtn" title="重做 (Ctrl+Y)">↪️</button>
            </div>
            <div class="one group">
                <button class="btn danger" id="clearCanvasBtn">🗑️ 清空</button>
            </div>
            <div class="one group">
                <button class="btn" id="zoomOutBtn" title="缩小 (Ctrl+滚轮)">🔍−</button>
                <span class="zoom-display" id="zoomDisplay">100%</span>
                <button class="btn" id="zoomInBtn" title="放大 (Ctrl+滚轮)">🔍+</button>
                <button class="btn" id="zoomResetBtn" title="重置为 100%">重置</button>
            </div>
        </div>
        <section class="editor">
            <div class="canvas-card canvas-container" id="canvasContainer">
                <div class="scene-canvas" id="sceneCanvas"></div>
                <div class="float-panel" id="rightPanel">
                <div id="propsPanel" style="display:none;">
                    <div class="panel-header">
                        <span>✨ 选中元素</span>
                        <span class="header-actions">
                            <span style="cursor:pointer;" id="closePropsBtn">✕</span>
                            <button class="panel-collapse-btn" title="收起面板">▁</button>
                        </span>
                    </div>
                    <div id="multiSelectPanel" style="display:none;">
                        <div class="preview-card">
                            <div class="preview-char" style="font-size:20px;" id="multiCount">已选 2 个</div>
                            <button class="btn danger" id="multiDeleteBtn">🗑️ 批量删除</button>
                            <button class="btn" id="multiCancelBtn">取消选择</button>
                        </div>
                    </div>
                    <div id="selectionControls">
                        <div class="preview-card">
                            <div class="preview-char" id="previewChar">🌟</div>
                            <button class="btn copy-btn" id="copyCharBtn">📋 复制字符</button>
                        </div>
                        <div class="slider-row">
                            <span>字号 <span class="tooltip-icon" data-tooltip="可在元素四角拖拽缩放">?</span></span>
                            <span id="sizeValueDisplay">48</span>
                            <input type="range" id="sizeSlider" min="12" max="140" step="1">
                        </div>
                        <div class="slider-row">
                            <span>旋转 <span class="tooltip-icon" data-tooltip="旋转角度 -180~180">?</span></span>
                            <span id="rotationValueDisplay">0</span>
                            <input type="range" id="rotationSlider" min="-180" max="180" step="1">
                        </div>
                        <div class="slider-row">
                            <span>透明度</span>
                            <span id="opacityValueDisplay">100%</span>
                            <input type="range" id="opacitySlider" min="0" max="100" step="1">
                        </div>
                        <div class="slider-row">
                            <span>重复 <span class="tooltip-icon" data-tooltip="退格键减少重复，Delete删除整个">?</span></span>
                            <span id="repeatValueDisplay">1</span>
                            <input type="range" id="repeatSlider" min="1" max="20" step="1">
                        </div>
                        <div id="colorControlArea" style="display:none;">
                            <div class="slider-row">
                                <span>颜色</span>
                                <input type="color" id="charColorPicker" value="#2c5a2c">
                            </div>
                        </div>
                        <div class="layer-buttons">
                            <button class="btn danger delete-btn" id="deleteItemBtn">🗑️ 删除</button>
                        </div>
                    </div>
                </div>
                <div id="libraryPanel">
                    <div class="panel-header">📚 字符素材库 <button class="panel-collapse-btn" title="收起面板">▁</button></div>
                    <div class="tab-bar">
                        <button class="tab-btn active" data-tab="emoji">😊 Emoji</button>
                        <button class="tab-btn" data-tab="normal">🔤 普通符号</button>
                    </div>
                    <div id="emojiSymbolsContainer" class="symbols-scroll"></div>
                    <div id="normalSymbolsContainer" class="symbols-scroll" style="display:none;"></div>
                </div>
                <div id="layerPanel">
                    <div class="panel-header">
                        <span>🎨 图层</span>
                        <button class="layer-toggle" id="layerToggleBtn" title="展开/收起">▶</button>
                    </div>
                    <div id="layerList" class="layer-list" style="display:none;"></div>
                </div>
                </div>
                <button class="float-reopen" id="reopenPanelBtn" style="display:none;" title="打开素材库">📚 素材</button>
            </div>
        </section>

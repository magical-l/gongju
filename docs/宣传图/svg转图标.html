<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
	width: 1000px;
	height: 637px;
	background: #eef0f7;
	font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
	display: flex;
	align-items: stretch;
	padding: 40px;
	overflow: hidden;
}

/*---------- 左：SVG 输入框 ----------*/
.input.box {
	flex: 0 0 560px;
	background: #fff;
	border: 1px solid #dcdde8;
	border-radius: 14px;
	box-shadow: 0 6px 20px rgba(60, 62, 92, .1);
	padding: 18px 20px 0;
	overflow: hidden;
	position: relative;
}

/*
 * 所有缩略图必须用同一个宽高比（这里取 1.566 = 260/166）：首页卡片图区高度固定、
 * 宽度随视口和栅格列数变，比例不一致的会在某些窗口宽度下渲染得比别的矮。
 * 画布 1000×637 就取这个比例（780×498 同比例，可换用）。
 *
 * 字号 28px 是算出来的，不是随手挑的：
 * 图在卡片里的显示宽度 = 图区宽度（约 260~414px，随视口），画布 1000 宽时缩放约 0.26~0.41；
 * 要让代码在卡片上还有 ~9px 的可读字号，画布里就得约 28px。
 * 代价是每行只装得下约 30 个字符，所以下面这段代码是按短行重排过的。
 */
.input.box .code {
	font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
	font-size: 28px;
	line-height: 1.52;
	white-space: pre;
	color: #5c5f7a;
}

.input.box .code .tag { color: #757cbb; }
.input.box .code .attr { color: #8a7540; }
.input.box .code .str { color: #4b7a5f; }

/* 底部渐隐：示意代码没展示完 */
.input.box::after {
	content: "";
	position: absolute;
	left: 1px; right: 1px; bottom: 1px;
	height: 104px;
	border-radius: 0 0 13px 13px;
	background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, #fff 66%);
}

/*---------- 中：箭头 ----------*/
.arrow {
	flex: 0 0 86px;
	display: flex;
	align-items: center;
	justify-content: center;
	color: #757cbb;
}

/*---------- 右：同一图标，三档尺寸 ----------*/
.sizes {
	flex: 1;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: flex-start;
	gap: 26px;
	color: #3d3f57;
}

.sizes .one {
	display: flex;
	flex-direction: column;
	align-items: flex-start;
	gap: 8px;
}

.sizes .label {
	font-size: 30px;
	white-space: nowrap;
	color: #45455d;
}

.star {
	background: currentColor;
	clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
</style>
</head>
<body>
	<div class="input box">
		<div class="code"><span class="tag">&lt;svg</span> <span class="attr">viewBox</span>=<span class="str">"0 0 36 36"</span><span class="tag">&gt;</span>
  <span class="tag">&lt;path</span> <span class="attr">fill-rule</span>=<span class="str">"evenodd"</span>
    <span class="attr">d</span>=<span class="str">"M18 3.2l4.34 8.79</span>
    <span class="str">9.7 1.41-7.02 6.84</span>
    <span class="str">1.66 9.66L18 25.34</span>
    <span class="str">l-8.68 4.56 1.66</span>
    <span class="str">-9.66-7.02-6.84</span>
    <span class="str">9.7-1.41L18 3.2z"</span>
    <span class="attr">fill</span>=<span class="str">"currentColor"</span><span class="tag">/&gt;</span>
  <span class="tag">&lt;circle</span> <span class="attr">cx</span>=<span class="str">"18"</span> <span class="attr">cy</span>=<span class="str">"18"</span>
    <span class="attr">r</span>=<span class="str">"2.4"</span><span class="tag">/&gt;</span>
<span class="tag">&lt;/svg&gt;</span></div>
	</div>

	<div class="arrow">
		<svg width="52" height="36" viewBox="0 0 52 36" fill="none">
			<path d="M3 18h42" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
			<path d="M33 4l16 14-16 14" stroke="currentColor" stroke-width="5.5"
				stroke-linecap="round" stroke-linejoin="round"/>
		</svg>
	</div>

	<div class="sizes">
		<div class="one">
			<div class="star" style="width:52px;height:52px"></div>
			<span class="label">16 × 16</span>
		</div>
		<div class="one">
			<div class="star" style="width:110px;height:110px"></div>
			<span class="label">48 × 48</span>
		</div>
		<div class="one">
			<div class="star" style="width:184px;height:184px"></div>
			<span class="label">128 × 128</span>
		</div>
	</div>
</body>
</html>

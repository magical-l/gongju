	<style>

<body>
<header>
	<h1 class="name">在线工具</h1>
	<nav>
		<a href="文本转化.html">文本转化</a>

		<a href="拼音/拼音.html">拼音</a>
	</nav>
</header>
<main>
	<section class="input area">
		<label for="svg-input">SVG代码：</label>
		<textarea id="svg-input" placeholder="SVG代码" v-model="input">
			<svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M9.77234 30.8573V11.7471H7.54573C5.50932 11.7471 3.85742 13.3931 3.85742 15.425V27.1794C3.85742 29.2112 5.50932 30.8573 7.54573 30.8573H9.77234ZM11.9902 30.8573V11.7054C14.9897 10.627 16.6942 7.8853 17.1055 3.33591C17.2666 1.55463 18.9633 0.814421 20.5803 1.59505C22.1847 2.36964 23.243 4.32583 23.243 6.93947C23.243 8.50265 23.0478 10.1054 22.6582 11.7471H29.7324C31.7739 11.7471 33.4289 13.402 33.4289 15.4435C33.4289 15.7416 33.3928 16.0386 33.3215 16.328L30.9883 25.7957C30.2558 28.7683 27.5894 30.8573 24.528 30.8573H11.9911H11.9902Z" fill="currentColor"></path></svg>
		</textarea>
	</section>

	<section class="result area">
		<label>预览：</label>
		<div class="preview-container">
			<div class="preview-item">
				<div>16×16</div>
				<svg class="preview-icon" width="16" height="16" viewBox="0 0 36 36"></svg>
			</div>
			<div class="preview-item">
				<div>32×32</div>
				<svg class="preview-icon" width="32" height="32" viewBox="0 0 36 36"></svg>
			</div>
			<div class="preview-item">
				<div>48×48</div>
				<svg class="preview-icon" width="48" height="48" viewBox="0 0 36 36"></svg>
			</div>
			<div class="preview-item">
				<div>128×128</div>
				<svg class="preview-icon" width="128" height="128" viewBox="0 0 36 36"></svg>
			</div>
		</div>
	</section>

	<div class="btn-container">
		<button id="preview-btn">预览图标</button>
		<button id="download-btn" class="download-btn">下载图标包</button>
	</div>
</main>
<footer>
	<div class="qr-code">
		<img src="resources/支付宝收款码.jpg" alt="支付宝收款码" title="赞助一下">
		<span>赞助一下</span>
	</div>
	<div>

		<p>一个用于将 SVG 代码转换为不同尺寸 PNG 图标的工具。</p>
		<p>反馈或建议请联系：<a href="mailto:lwj621@sohu.com">lwj621@sohu.com</a></p>
	</div>
</footer>
<div>
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script src="https://unpkg.com/primevue/umd/primevue.min.js"></script>
	<script src="https://unpkg.com/@primeuix/themes/umd/aura.js"></script>
</div>
<script>
	document.getElementById('preview-btn').addEventListener('click', updatePreview);
	document.getElementById('download-btn').addEventListener('click', downloadIcons);

	function updatePreview() {
		const svgCode = document.getElementById('svg-input').value;
		const previewIcons = document.querySelectorAll('.preview-icon');

		previewIcons.forEach(icon => {
			// 清空现有内容
			while (icon.firstChild) {
				icon.removeChild(icon.firstChild);
			}

			// 创建临时容器解析SVG
			const tempDiv = document.createElement('div');
			tempDiv.innerHTML = svgCode;
			const svgElement = tempDiv.querySelector('svg');

			if (svgElement) {
				// 克隆SVG并添加到预览容器
				const clonedSvg = svgElement.cloneNode(true);
				icon.appendChild(clonedSvg);
			}
		});
	}

	function downloadIcons() {
		const svgCode = document.getElementById('svg-input').value;
		const sizes = [16, 32, 48, 128];

		sizes.forEach(size => {
			// 创建SVG元素
			const parser = new DOMParser();
			const svgDoc = parser.parseFromString(svgCode, 'image/svg+xml');
			const svgElement = svgDoc.documentElement;

			// 设置尺寸
			svgElement.setAttribute('width', size);
			svgElement.setAttribute('height', size);

			// 创建canvas用于转换
			const canvas = document.createElement('canvas');
			canvas.width = size;
			canvas.height = size;
			const ctx = canvas.getContext('2d');

			// 创建图片对象
			const img = new Image();
			const svgBlob = new Blob([new XMLSerializer().serializeToString(svgElement)], {type: 'image/svg+xml'});
			const url = URL.createObjectURL(svgBlob);

			img.onload = function () {
				// 绘制到canvas
				ctx.clearRect(0, 0, size, size);
				ctx.drawImage(img, 0, 0, size, size);

				// 转换为PNG并下载
				const pngUrl = canvas.toDataURL('image/png');
				const link = document.createElement('a');
				link.download = `icon-${size}x${size}.png`;
				link.href = pngUrl;
				link.click();

				// 清理
				URL.revokeObjectURL(url);
			};

			img.src = url;
		});
	}

	// 初始预览
	updatePreview();

	const {createApp} = Vue;
	const app = createApp({
		components: {
			'choose-group': PrimeVue.SelectButton,
			'p-button': PrimeVue.Button,
			'p-textarea': PrimeVue.Textarea,
			'p-fieldset': PrimeVue.Fieldset,
			'card': PrimeVue.Card,
			'toolbar': PrimeVue.Toolbar,
			'p-checkbox': PrimeVue.Checkbox
		},
		data() {
			return {
				inputText: '',
				results
			};
		},
		methods: {
			processInput() {
				Object.values(this.results).forEach(result => {
					this.updateResult(result, this.inputText);
				});
			},
			updateResult(result, inputText) {
				if (inputText) {
					try {
						result.value = result.convert.call(result, inputText);
					} catch (e) {
						console.error(`Error processing result:`, e);
						result.value = '转换出错';
					}
				} else {
					result.value = '';
				}
			},
		},
		mounted() {
			this.processInput();
		}
	})
	.use(PrimeVue.Config, {
		theme: {
			preset: PrimeUIX.Themes.Aura
		}
	})
	.mount('main');
</script>
</body>
</html>

<!-- C-Chooser 智能选择器组件 -->
<!-- 使用方式：<c-chooser v-model="value" :options="options" label-field="name" value-field="id" 			:atLeast="0" :atMost="null"></c-chooser> -->

<template id="c-chooser-template">
	<div class="c-chooser-container">
		<!--
			关键属性解释:
			- v-model="internalValue": 核心双向绑定。
			- :options="processedOptions": 统一处理后的选项数组，格式为 [{label, value}, ...]。
			- optionLabel="label": 指定使用 processedOptions 中的 'label' 属性作为显示文本。
			- optionValue="value": 指定使用 processedOptions 中的 'value' 属性作为选项的值。
			- dataKey="value": 必须项。它能唯一标识每个选项，确保状态更新正确。
		-->
		<component :is="componentType"
							 v-model="internalValue"
							 :options="processedOptions"
							 option-label="label"
							 option-value="value"
							 data-key="value"
							 :placeholder="placeholder"
							 :multiple="isMultipleMode"
							 :filter="componentType !== 'SelectButton'">
		</component>
	</div>
</template>

<style>
	.c-chooser-container {
		display: inline-block;
		min-width: 200px;
	}
</style>

<script>
	// C-Chooser 智能选择器组件
	// 根据选项数量自动选择 SelectButton(<5) 或 Select(>=5) 组件
	const CChooser = {
		template: '#c-chooser-template',
		props: {
			modelValue: [String, Number, Array, Object],
			options: {
				type: Array,
				required: true,
				default: () => []
			},
			labelField: {
				type: String,
				default: null
			},
			valueField: {
				type: String,
				default: null
			},
			atLeast: {
				type: Number,
				default: 0
			},
			atMost: {
				type: Number,
				default: null
			},
			placeholder: {
				type: String,
				default: '请选择'
			}
		},
		emits: ['update:modelValue'],
		computed: {
			// 根据选项数量决定使用哪个组件
			componentType() {
				if (this.options.length < 5) {
					return 'SelectButton';
				}
				// 如果选项数量大于等于5，则根据是否多选来决定使用 MultiSelect 还是 Select
				return this.isMultipleMode ? 'MultiSelect' : 'Select';
			},
			isMultipleMode() {
				return this.atLeast > 1 || this.getActualMax() > 1;
			},
			// 统一处理选项，始终返回 {label, value} 格式的数组
			processedOptions() {
				return this.options.map(option => {
					if (typeof option === 'object' && option !== null && !Array.isArray(option)) {
						// 对象类型选项
						const label = this.labelField ? option[this.labelField] : this.getObjectLabel(option);
						const value = this.valueField ? option[this.valueField] : option;
						return {label: String(label), value: value};
					}
					// 基础类型选项 (string, number)
					return {label: String(option), value: option};
				});
			},
			// 简化的双向绑定处理
			internalValue: {
				get() {
					// 如果是多选模式，确保 internalValue 始终是数组
					if (this.isMultipleMode) {
						return Array.isArray(this.modelValue) ? this.modelValue : [];
					}
					return this.modelValue;
				},
				set(newValue) {
					// 如果是多选模式，确保 newValue 始终是数组
					if (this.isMultipleMode) {
						this.$emit('update:modelValue', Array.isArray(newValue) ? newValue : []);
					} else {
						this.$emit('update:modelValue', newValue);
					}
				}
			}
		},
		methods: {
			// 从对象中智能获取用于显示的标签
			getObjectLabel(option) {
				const commonLabelKeys = ['label', 'name', 'title', 'text'];
				for (const key of commonLabelKeys) {
					if (option[key] !== undefined) {
						return option[key];
					}
				}
				// 如果找不到常见标签，则返回对象的JSON字符串形式
				return JSON.stringify(option);
			},
			getActualMax() {
				return this.atMost === null ? this.atLeast : this.atMost;
			}
		}
	};

	// 注册到全局，以便 test.html 直接使用
	if (typeof window !== 'undefined') {
		window.customComponents = window.customComponents || {};
		window.customComponents.CChooser = CChooser;
	}
</script>

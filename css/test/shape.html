<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>特殊图形图案测试</title>
    <link rel="stylesheet" href="../花活.css">
    <link rel="stylesheet" href="../common.css">
    <style>
        body { padding: 20px; font-family: sans-serif; background: #f5f5f5; color: #333; }
        h1 { color: #2196f3; }
        h2 { margin-top: 30px; color: #9c27b0; border-bottom: 1px solid #ddd; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; background: #fff; }
        .case-num { font-weight: bold; color: #ffab91; }
        .taiji-demo { margin: 10px; background: #e0e0e0; border-radius: 50%; }
    </style>
</head>
<body>

<h1>特殊图形图案测试</h1>

<h2>太极图 <code>.taiji</code></h2>
<div class="section">
    <p><span class="case-num">用例1</span> 默认尺寸 100x100</p>
    <div class="taiji taiji-demo"></div>
</div>

<div class="section">
    <p><span class="case-num">用例2</span> 自定义尺寸和颜色</p>
    <div class="taiji" style="width:60px;height:60px;--taiji-yin-color:#e94560;--taiji-yang-color:#fff8e1;--taiji-border-color:#e94560;"></div>
    <div class="taiji" style="width:150px;height:150px;--taiji-yin-color:#333;--taiji-yang-color:#ffc107;"></div>
</div>

<h2>三角箭头 <code>.shape.triangle.to-{方向}.at-{位置}</code></h2>
<div class="section">
    <p><span class="case-num">用例3</span> 4方向 × 4位置 = 16种组合</p>
    <table style="border-collapse:collapse;width:100%;">
        <tr>
            <th style="padding:8px;border:1px solid #ddd;">方向</th>
            <th style="padding:8px;border:1px solid #ddd;">at-top</th>
            <th style="padding:8px;border:1px solid #ddd;">at-right</th>
            <th style="padding:8px;border:1px solid #ddd;">at-bottom</th>
            <th style="padding:8px;border:1px solid #ddd;">at-left</th>
        </tr>
        <tr>
            <td style="padding:8px;border:1px solid #ddd;text-align:center;">to-down</td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-down at-top" style="display:inline-block;padding:20px 10px 5px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-down at-right" style="display:inline-block;padding:10px 20px 10px 10px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-down at-bottom" style="display:inline-block;padding:5px 10px 20px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-down at-left" style="display:inline-block;padding:10px 10px 10px 20px;">文字</span></td>
        </tr>
        <tr>
            <td style="padding:8px;border:1px solid #ddd;text-align:center;">to-up</td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-up at-top" style="display:inline-block;padding:20px 10px 5px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-up at-right" style="display:inline-block;padding:10px 20px 10px 10px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-up at-bottom" style="display:inline-block;padding:5px 10px 20px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-up at-left" style="display:inline-block;padding:10px 10px 10px 20px;">文字</span></td>
        </tr>
        <tr>
            <td style="padding:8px;border:1px solid #ddd;text-align:center;">to-left</td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-left at-top" style="display:inline-block;padding:20px 10px 5px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-left at-right" style="display:inline-block;padding:10px 20px 10px 10px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-left at-bottom" style="display:inline-block;padding:5px 10px 20px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-left at-left" style="display:inline-block;padding:10px 10px 10px 20px;">文字</span></td>
        </tr>
        <tr>
            <td style="padding:8px;border:1px solid #ddd;text-align:center;">to-right</td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-right at-top" style="display:inline-block;padding:20px 10px 5px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-right at-right" style="display:inline-block;padding:10px 20px 10px 10px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-right at-bottom" style="display:inline-block;padding:5px 10px 20px;">文字</span></td>
            <td style="padding:15px;border:1px solid #ddd;text-align:center;"><span class="shape triangle to-right at-left" style="display:inline-block;padding:10px 10px 10px 20px;">文字</span></td>
        </tr>
    </table>
</div>

<div class="section">
    <p><span class="case-num">用例4</span> 自定义颜色、大小、间距</p>
    <button class="shape triangle to-down at-right" style="--triangle-color:#e94560;--triangle-size:8px;--triangle-offset:8px;padding:10px 28px 10px 12px;">大箭头</button>
    <button class="shape triangle to-right at-right" style="--triangle-color:#4caf50;--triangle-size:4px;--triangle-offset:4px;padding:8px 16px 8px 8px;">小箭头</button>
</div>

</body>
</html>

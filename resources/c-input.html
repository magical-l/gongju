<!-- C-Input 智能输入框组件 -->
<template id="c-input-template">
	<div class="c-input-container" :class="{'resizing': isDragging}">
		<p-textarea v-model="internalValue" ref="textarea"
								:placeholder="placeholder"
								:size="size" :variant="variant" :disabled="disabled"
								:invalid="invalid"
								:rows="minRows" :auto-resize="isAutoResizeEffectivelyOn"
								:style="textareaStyle"
								@mousedown="onMouseDown">
		</p-textarea>
		<span v-if="showToggleButton"
					:title="hasBeenResized ? '切换到自动缩放模式' : '切换到手动调整模式'"
					class="resize-mode-toggle"
					@click="toggleResizeMode">
      <span v-if="hasBeenResized">🔄</span>
      <span v-else>🔒</span>
    </span>
	</div>
</template>

<style>
	/* 原有样式保持不变 */
	.c-input-container {
		display: inline-block;
		position: relative;
		width: 100%;
	}

	.c-input-container .p-textarea {
		width: 100%;
		min-height: 2.5em;
	}

	.c-input-container.resizing .p-textarea {
		overflow: hidden !important;
		pointer-events: none !important;
		transition: none !important;
	}

	.resize-mode-toggle {
		position: absolute;
		top: 0.5rem;
		right: 0.5rem;
		cursor: pointer;
		font-size: 1.1rem;
		background: rgba(255, 255, 255, 0.7);
		border-radius: 3px;
		width: 24px;
		height: 24px;
		display: flex;
		align-items: center;
		justify-content: center;
		z-index: 10;
	}

	.resize-mode-toggle:hover {
		background: #f0f0f0;
	}
</style>

<script>
	const CInput = {
		template: '#c-input-template',
		components: {
			'p-textarea': PrimeVue.Textarea
		},
		props: {
			modelValue: [String, Number],
			placeholder: {type: String, default: ''},
			minRows: {type: Number, default: 1},
			resizable: {
				type: String,
				default: 'yes',
				validator: value => ['yes', 'auto', 'manual', 'no'].includes(value)
			},
			size: {type: String, default: null},
			variant: {type: String, default: 'outlined'},
			invalid: {type: Boolean, default: false},
			disabled: {type: Boolean, default: false}
		},
		data() {
			return {
				isDragging: false,
				manualHeight: null,
				hasBeenResized: false,
				startY: 0,
				startHeight: 0,
			};
		},
		emits: ['update:modelValue'],
		computed: {
			showToggleButton() {
				return this.resizable === 'yes';
			},
			isAutoResizeEffectivelyOn() {
				return !this.isDragging &&
							 !(this.resizable === 'yes' && this.hasBeenResized) &&
							 (this.resizable === 'yes' || this.resizable === 'auto');
			},
			textareaStyle() {
				const style = {
					resize: this.resizable === 'yes' || this.resizable === 'manual' ? 'both' : 'none'
				};
				// 当手动调整过时固定高度
				if (this.hasBeenResized && this.manualHeight) {
					const height = `${this.manualHeight}px`;
					style.height = height;
					style.minHeight = height;
					style.maxHeight = height;

					// 始终允许滚动条出现
					style.overflowX = 'auto';
					style.overflowY = 'auto';
				} else if (this.minRows > 0) {// 其他模式设置最小高度
					style.minHeight = `${this.minRows * 1.5}rem`;
				}
				return style;
			},
			internalValue: {
				get() {
					return this.modelValue || '';
				},
				set(newValue) {
					this.$emit('update:modelValue', newValue);
				}
			}
		},
		methods: {
			onMouseDown(event) {
				const isResizable = ['yes', 'manual'].includes(this.resizable);
				if (isResizable && this.isResizing(event)) {
					this.isDragging = true;
					const textarea = this.$refs.textarea.$el;

					this.startY = event.clientY;
					this.startHeight = textarea.clientHeight;

					window.addEventListener('mousemove', this.onDragMove);
					window.addEventListener('mouseup', this.onDragEnd, {once: true});
				}
			},
			onDragMove(event) {
				if (this.isDragging) {
					if (this.resizable === 'yes') {
						this.hasBeenResized = true;
					}
					this.manualHeight = this.startHeight + (event.clientY - this.startY);
				}
			},
			onDragEnd() {
				if (this.isDragging) {
					// 确保高度设置
					if (this.$refs.textarea && this.manualHeight) {
						const textarea = this.$refs.textarea.$el;
						textarea.style.minHeight = `${this.manualHeight}px`;
						textarea.style.maxHeight = `${this.manualHeight}px`;
					}
					this.isDragging = false;
					window.removeEventListener('mousemove', this.onDragMove);
				}
			},
			toggleResizeMode() {
				if (!this.showToggleButton) {
					return;
				}
				this.hasBeenResized = !this.hasBeenResized;
				if (this.hasBeenResized) {
					this.$nextTick(() => {
						if (this.$refs.textarea) {
							const textarea = this.$refs.textarea.$el;
							// 设置当前高度为内容高度
							this.manualHeight = textarea.scrollHeight;
							textarea.style.height = `${this.manualHeight}px`;
							textarea.style.overflowY = 'auto';
						}
					});
				} else {
					this.manualHeight = null;
					this.$nextTick(() => {
						if (this.$refs.textarea) {
							const textarea = this.$refs.textarea.$el;
							textarea.style.height = '';
						}
					});
				}
			},
			isResizing(event) {
				const el = event.target;
				return event.offsetY > el.clientHeight - 16 && event.offsetX > el.clientWidth - 16;
			}
		},
		watch: {
			resizable(newVal) {
				this.manualHeight = null;
				this.isDragging = false;
				this.hasBeenResized = false;
			}
		},
		mounted() {
			this.$nextTick(() => {
				if (this.$refs.textarea) {
					const textarea = this.$refs.textarea.$el;
					if (this.resizable === 'manual' && !this.manualHeight) {
						this.manualHeight = textarea.scrollHeight;
						this.hasBeenResized = true;
					}
				}
			});
		},
		beforeUnmount() {
			window.removeEventListener('mouseup', this.onDragEnd);
			window.removeEventListener('mousemove', this.onDragMove);
		}
	};

	if (typeof window !== 'undefined') {
		window.customComponents = window.customComponents || {};
		window.customComponents.CInput = CInput;
	}
</script>

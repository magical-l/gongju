<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<title>数字转化</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="在线数字处理工具，支持进制转换、汉语数字转换等功能">
	<meta name="keywords" content="数字处理,进制转换,汉语数字,二进制,十六进制">
	<meta name="author" content="数字转化">

	<!-- 预加载关键资源 -->
	<link rel="preload" href="lib/jquery-3.4.1.min.js" as="script">
	<link rel="preload" href="lib/math.js" as="script">

	<link href="https://cdn.jsdelivr.net/npm/primeicons/primeicons.css" rel="stylesheet">
	<link href="lib/toastr.min.css?v=0204a" rel="stylesheet"><!-- 提示框 -->
	<link href="lib/iconfont/iconfont.css" rel="stylesheet">
	<link href="lib/style.css?v=0229b" rel="stylesheet">
	<style>
		body {
			font-family: sans-serif;
		}

		main {
			display: flex;
			flex-wrap: wrap;
			align-items: start;
			gap: 1rem;
		}

		header,
		.input.area {
			flex-basis: 100%;
		}

		main > header {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		main nav a {
			margin-left: 1rem;
			text-decoration: none;
			color: #333;
		}

		main nav a.active {
			font-weight: bold;
			border-bottom: 2px solid #007bff;
		}

		.input.area textarea {
			width: 100%;
			min-height: 100px;
			box-sizing: border-box;
		}

		.setting.area {
			flex: 1;
			min-width: 280px;
		}

		.one.setting {
			display: flex;
			align-items: center;
			gap: 1rem;
			margin-bottom: 1rem;
		}

		.result.area {
			flex: 4;
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			align-items: start;
			column-gap: 1rem;
		}

		.result.area > header {
			grid-column: 1 / -1;
			color: #666;
			font-style: italic;
		}

		.one.result {
			cursor: pointer;
			transition: background-color 0.2s;
		}

		.one.result:hover {
			background-color: #f0f8ff; /* 悬停高亮样式 */
		}

		/* 修正卡片内边距，解决内容偏下问题 */
		.one.result .p-feldset-content {
			padding: 0.5rem 0;
		}

		.one.result .value {
			/* 隐藏过长文本 */
			max-width: 300px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.one.result .placeholder {
			color: #6c757d;
			font-style: italic;
		}

		@media (max-width: 1024px) {
			.result.area {
				grid-template-columns: repeat(2, 1fr);
			}
		}

		@media (max-width: 768px) {
			.setting.area,
			.result.area {
				flex-basis: 100%;
			}

			.result.area {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
<main>
	<header>
		<nav>
			<a href="文本转化.html">文本转化</a>
			<a href="数字转化.html" class="active">数字转化</a>
		</nav>
	</header>

	<section class="input area">
		<p-textarea placeholder="在此输入要处理的数字" v-model="inputText" @input="processInput" rows="5"
								autoResize></p-textarea>
	</section>

	<!--<p-fieldset legend="设置" class="setting area">
		<div class="one setting">
			<label>0小写：</label>
			<p-selectbutton v-model="settings.mode0" :options="mode0Options"></p-selectbutton>
		</div>
		<div class="one setting">
			<label>1小写：</label>
			<p-selectbutton v-model="settings.mode1" :options="mode1Options"></p-selectbutton>
		</div>
		<div class="one setting">
			<label>2小写：</label>
			<p-selectbutton v-model="settings.mode2" :options="mode2Options"></p-selectbutton>
		</div>
		<div class="one setting">
			<label>7小写：</label>
			<p-selectbutton v-model="settings.mode7" :options="mode7Options"></p-selectbutton>
		</div>
		<div class="one setting">
			<label>10开头：</label>
			<p-selectbutton v-model="settings.mode10" :options="mode10Options"></p-selectbutton>
		</div>
		<div class="one setting">
			<label>20小写：</label>
			<p-selectbutton v-model="settings.mode20" :options="mode20Options"></p-selectbutton>
		</div>
		<div class="one setting">
			<label>30小写：</label>
			<p-selectbutton v-model="settings.mode30" :options="mode30Options"></p-selectbutton>
		</div>
	</p-fieldset>-->

	<section class="result area">
		<header>
			点击数值即可复制
			|
			数字数位过多可能会有精度问题
		</header>
		<p-fieldset class="one result" title="点击复制" @click="copyToClipboard(result.value)"
					v-for="result in results" :key="result.type">
			<template #legend>
				{{ result.label }}
			</template>
			<div v-if="result.value" style="display: flex; justify-content: space-between; align-items: center;">
				<span class="value">{{result.value}}</span>
				<p-button title="把此结果作为输入" aria-label="把此结果作为输入" @click.stop="asInput(result.value)"
									variant="outlined" serverity="info">
					<i class="pi pi-upload"></i>
				</p-button>
			</div>
			<div v-else class="placeholder">（等待输入）</div>
		</p-fieldset>
	</section>
</main>
<div>
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script src="https://unpkg.com/primevue/umd/primevue.min.js"></script>
	<script src="https://unpkg.com/@primeuix/themes/umd/aura.js"></script>
	<script src="lib/jquery-3.4.1.min.js"></script>
	<script src="lib/toastr.min.js"></script>
	<script src="lib/util.js"></script>
	<script src="lib/biz-util.js"></script>
	<script src="lib/ue.js"></script>
	<script src="lib/math.js"></script>
	<script src="lib/base64.js"></script>
</div>
<script>
	const {createApp} = Vue;

	const app = createApp({
		components: {
			'p-selectbutton': PrimeVue.SelectButton,
			'p-button': PrimeVue.Button,
			'p-textarea': PrimeVue.Textarea,
			'p-fieldset': PrimeVue.Fieldset,
			'card': PrimeVue.Card
		},
		data() {
			return {
				inputText: '',
				// settings: {
				// 	mode0: '〇',
				// 	mode1: '一',
				// 	mode2: '二',
				// 	mode7: '七',
				// 	mode10: '一十',
				// 	mode20: '二十',
				// 	mode30: '三十'
				// },
				// mode0Options: ['〇', '零', '洞'],
				// mode1Options: ['一', '幺'],
				// mode2Options: ['二', '两'],
				// mode7Options: ['七', '拐'],
				// mode10Options: ['一十', '十'],
				// mode20Options: ['二十', '廿'],
				// mode30Options: ['三十', '卅'],
				results: [
					{type: 'dec', label: '十进制', value: '', placeholder: '请输入数字'},
					{type: 'bcd', label: '二进制', value: '', placeholder: '请输入数字'},
					{type: 'hex', label: '十六进制', value: '', placeholder: '请输入数字'},
					{type: 'oct', label: '八进制', value: '', placeholder: '请输入数字'},
					{type: 'CN-digit', label: '汉语数码', value: '', placeholder: '例：一〇八'},
					{type: 'CN-num', label: '汉语数字', value: '', placeholder: '例：一百〇八'},
					{type: 'CN-digit-upper', label: '大写汉语数码', value: '', placeholder: '例：壹零捌'},
					{type: 'CN-num-upper', label: '大写汉语数字', value: '', placeholder: '例：壹佰零捌'}
				]
			};
		},
		methods: {
			async copyToClipboard(text) {
				if (!text) {
					return;
				}
				try {
					await navigator.clipboard.writeText(text);
				} catch (err) {
					const textArea = document.createElement('textarea');
					textArea.value = text;
					document.body.appendChild(textArea);
					textArea.select();
					document.execCommand('copy');
					document.body.removeChild(textArea);
				}
				toastr.success('已复制到剪贴板');
			},
			processInput() {
				if (!this.inputText) {
					this.results.forEach(result => result.value = '');
					return;
				}

				const transformNumbers = conversionFunc => {
					return this.inputText.replace(/\d+/g, numberString => {
						try {
							return conversionFunc(numberString, 10);
						} catch (e) {
							return numberString;
						}
					});
				};

				this.results[0].value = this.inputText;
				this.results[1].value = transformNumbers(convertToBinary);
				this.results[2].value = transformNumbers(convertToHex);
				this.results[3].value = transformNumbers(convertToOctal);

				let chineseDigit = transformNumbers(convertToChineseDigit);
				let chineseNumber = transformNumbers(ChineseNum.fromArabic);
				let chineseDigitUpper = transformNumbers(convertToChineseDigitUpper);
				let chineseNumberUpper = transformNumbers(convertToChineseNumberUpper);

				// if (chineseDigit) {
				// 	chineseDigit = chineseDigit
				// 	.replace(/〇/g, this.settings.mode0)
				// 	.replace(/一/g, this.settings.mode1)
				// 	.replace(/二/g, this.settings.mode2)
				// 	.replace(/七/g, this.settings.mode7);
				// }
				// if (chineseNumber) {
				// 	chineseNumber = chineseNumber
				// 	.replace(/一十/g, this.settings.mode10)
				// 	.replace(/二十/g, this.settings.mode20)
				// 	.replace(/三十/g, this.settings.mode30);
				// }

				this.results[4].value = chineseDigit;
				this.results[5].value = chineseNumber;
				this.results[6].value = chineseDigitUpper;
				this.results[7].value = chineseNumberUpper;
			},
			asInput(val) {
				this.inputText = val;
				this.processInput();
			}
		},
		mounted() {
			this.processInput();
		}
	});

	app.use(PrimeVue.Config, {
		theme: {
			preset: PrimeUIX.Themes.Aura
		}
	});
	app.mount('main');
</script>
</body>
</html>

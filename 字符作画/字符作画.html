    <main>
        <header>
            <h2 class="page-lv name">字符作画</h2>
            <div class="page-lv help area">
                <button class="btn shape circle help-btn" title="显示说明">?</button>
            </div>
        </header>
        <div class="toolbar">
            <div class="one group">
                <button class="btn new-scene">✨ 新建</button>
                <button class="btn load-scene" title="导入 JSON 文件">📂 打开</button>
                <button class="btn export">📤 导出</button>
                <button class="btn canvas-settings">🖼️ 画布</button>
            </div>
            <div class="one group">
                <button class="btn undo" title="撤销 (Ctrl+Z)">↩️</button>
                <button class="btn redo" title="重做 (Ctrl+Y)">↪️</button>
            </div>
            <div class="one group">
                <button class="btn danger clear-canvas">🗑️ 清空</button>
            </div>
            <div class="one group">
                <button class="btn zoom-out" title="缩小 (Ctrl+滚轮)">🔍−</button>
                <span class="zoom-display">100%</span>
                <button class="btn zoom-in" title="放大 (Ctrl+滚轮)">🔍+</button>
                <button class="btn zoom-reset" title="重置为 100%">重置</button>
            </div>
        </div>
        <section class="canvas-editor">
            <div class="canvas-card" id="canvasContainer">
                <div class="scene-canvas" id="sceneCanvas"></div>
                <div class="float-panel" id="floatPanel">
                <details id="propsPanel">
                    <summary class="panel-header"><span class="panel-title">✨ 已选元素（无）</span></summary>
                    <div class="panel-body">
                        <div class="multi-select">
                            <div class="preview-card">
                                <div class="preview-char multi-count" style="font-size:20px;">已选 2 个</div>
                                <button class="btn danger delete-multi">🗑️ 批量删除</button>
                                <button class="btn cancel-multi">取消选择</button>
                            </div>
                        </div>
                        <div class="selection-controls">
                            <div class="selection-actions flex items-single-line items-x-space-between items-y-near-center">
                                <button class="btn close-props" title="取消选中">✕ 取消选中</button>
                                <button class="btn danger delete-item" title="删除元素">🗑️ 删除</button>
                            </div>
                            <div class="preview-card">
                                <div class="preview-char">🌟</div>
                                <button class="btn copy-char">📋 复制字符</button>
                            </div>
                            <div class="slider-row flex items-single-line items-x-space-between items-y-near-center">
                                <span>字号 <i class="icon help char-style" data-tooltip="可在元素四角拖拽缩放"></i></span>
                                <span class="size-value">48</span>
                                <input type="range" class="size-slider" min="12" max="140" step="1">
                            </div>
                            <div class="slider-row flex items-single-line items-x-space-between items-y-near-center">
                                <span>旋转 <i class="icon help char-style" data-tooltip="旋转角度 -180~180"></i></span>
                                <span class="rotation-value">0</span>
                                <input type="range" class="rotation-slider" min="-180" max="180" step="1">
                            </div>
                            <div class="slider-row flex items-single-line items-x-space-between items-y-near-center">
                                <span>透明度</span>
                                <span class="opacity-value">0%</span>
                                <input type="range" class="opacity-slider" min="0" max="100" step="1">
                            </div>
                            <div class="slider-row flex items-single-line items-x-space-between items-y-near-center">
                                <span>重复 <i class="icon help char-style" data-tooltip="退格键减少重复，Delete删除整个"></i></span>
                                <span class="repeat-value">1</span>
                                <input type="range" class="repeat-slider" min="1" max="20" step="1">
                            </div>
                            <div class="color-control">
                                <div class="slider-row flex items-single-line items-x-space-between items-y-near-center">
                                    <span>颜色</span>
                                    <input type="color" class="color-picker" value="#2c5a2c">
                                </div>
                            </div>
                        </div>
                    </div>
                </details>
                </div>
            </div>
            <div class="right-side flex items-single-line items-go-x items-y-stretch">
                <div class="layer-rail flex items-single-line items-go-y items-x-near-center" id="layerRail"></div>
                <aside class="library-bar flex items-single-line items-go-y items-x-stretch">
                    <div class="tab-bar btn-group items-go-x flex items-single-line no-shrink">
                        <label class="btn">
                            <input type="radio" name="symbolTab" value="emoji" checked>
                            😊 Emoji
                        </label>
                        <label class="btn">
                            <input type="radio" name="symbolTab" value="normal">
                            🔤 普通符号
                        </label>
                    </div>
                    <div class="flexible scrollable on-y when-content-long emoji-symbols"></div>
                    <div class="flexible scrollable on-y when-content-long normal-symbols"></div>
                </aside>
            </div>
        </section>
    </main>
    <footer>
        <article class="website info">
            <section class="patronage area">
                <img title="赞助一下" class="qr-code" alt="支付宝收款码" src="../resources/支付宝收款码.jpg">
                <p class="slogan">赞助一下</p>
            </section>
            <section class="copyright">
                <p>© 2026 工具兽版权所有 All rights reserved.</p>
            </section>
            <section class="feedback">
                <p>反馈或建议请联系：<a href="mailto:gongjumonster@163.com">gongjumonster@163.com</a></p>
            </section>
        </article>
    </footer>
    <dialog id="canvasSettingsDialog">
        <div class="body settings-body">
            <h3>🖌️ 画布设置</h3>
            <div class="size-row flex items-go-x items-y-near-center">
                <label>宽度 <input type="number" class="canvas-width" step="50"></label>
                <label>高度 <input type="number" class="canvas-height" step="50"></label>
            </div>
            <hr class="separator">
            <p class="group-title">背景</p>
            <div class="bg-type btn-group items-go-x flex">
                <label class="btn"><input type="radio" name="bgType" value="solid">纯色</label>
                <label class="btn"><input type="radio" name="bgType" value="gradient" checked>渐变</label>
            </div>
            <div class="solid-row">
                <input type="color" class="bg-color" value="#b2e0fa">
            </div>
            <div class="gradient-row">
                <div class="gradient-controls flex items-go-x items-single-line items-y-near-center">
                    <select class="gradient-dir">
                        <option value="to top">⬆️ 向上</option>
                        <option value="to right">➡️ 向右</option>
                        <option value="to bottom">⬇️ 向下</option>
                        <option value="to left">⬅️ 向左</option>
                        <option value="135deg">↗️ 对角线</option>
                    </select>
                </div>
                <div class="gradient-controls flex items-go-x items-single-line items-y-near-center">
                    <input type="color" class="grad-color-1" value="#b2e0fa">
                    <span>→</span>
                    <input type="color" class="grad-color-2" value="#c5e0a4">
                </div>
                <p class="group-title">预设背景色</p>
                <div class="preset-gradients flex items-go-x">
                    <button class="preset-btn" data-dir="135deg" data-c1="#b2e0fa" data-c2="#c5e0a4" title="点击套用此配色">🌤️ 天空草地</button>
                    <button class="preset-btn" data-dir="135deg" data-c1="#f5f7fa" data-c2="#c3cfe2" title="点击套用此配色">☁️ 淡灰</button>
                    <button class="preset-btn" data-dir="135deg" data-c1="#f6d365" data-c2="#fda085" title="点击套用此配色">🌅 日落</button>
                    <button class="preset-btn" data-dir="to bottom" data-c1="#a1c4fd" data-c2="#c2e9fb" title="点击套用此配色">💙 天空蓝</button>
                    <button class="preset-btn" data-dir="to right" data-c1="#d4fc79" data-c2="#96e6a1" title="点击套用此配色">🍃 青草</button>
                </div>
            </div>
            <div class="dialog-actions flex items-go-x items-near-right">
                <button type="button" class="dialog-cancel">取消</button>
                <button type="button" class="dialog-confirm">应用</button>
            </div>
        </div>
    </dialog>
    <div class="js container">
        <script src="../lib/jquery-3.4.1.min.js"></script>
        <script src="../lib/toastr.min.js"></script>
    </div>
    <script src="字符作画.js"></script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<title>数字转化</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="在线数字处理工具，支持进制转换、汉语数字转换等功能">
	<meta name="keywords" content="数字处理,进制转换,汉语数字,二进制,十六进制">
	<meta name="author" content="数字转化">

	<!-- 预加载关键资源 -->
	<link rel="preload" href="lib/jquery-3.4.1.min.js" as="script">
	<link rel="preload" href="lib/math.js" as="script">

	<link href="https://cdn.jsdelivr.net/npm/primeicons/primeicons.css" rel="stylesheet">
	<link href="lib/toastr.min.css?v=0204a" rel="stylesheet"><!-- 提示框 -->
	<link href="lib/iconfont/iconfont.css" rel="stylesheet">
	<link href="lib/style.css?v=0229b" rel="stylesheet">
	<style>
		body {
			font-family: sans-serif;
		}

		main {
			display: flex;
			flex-wrap: wrap;
			align-items: start;
			gap: 1rem;
		}

		header,
		.input.area {
			flex-basis: 100%;
		}

		main > header {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		main nav a {
			margin-left: 1rem;
			text-decoration: none;
			color: #333;
		}

		main nav a.active {
			font-weight: bold;
			border-bottom: 2px solid #007bff;
		}

		.input.area textarea {
			width: 100%;
			min-height: 100px;
			height: 100px;
			box-sizing: border-box;
		}

		.setting.area {
			flex: 1;
			min-width: 280px;
		}

		.one.setting {
			display: flex;
			align-items: center;
			gap: 1rem;
			margin-bottom: 1rem;
		}

		.result.area {
			flex: 4;
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			align-items: start;
			gap: 1rem; /* Use gap for both row and column spacing */
		}

		.result.area > header {
			grid-column: 1 / -1;
			color: #666;
			font-style: italic;
		}

		.one.result {
			cursor: pointer;
			transition: background-color 0.2s;
		}

		.one.result:hover {
			background-color: #f0f8ff;
		}

		.one.result .p-card-body {
			padding: 0.75rem;
		}

		.one.result .p-card-content {
			padding: 0;
		}

		.one.result .p-card-title {
			font-size: 1rem;
			margin-bottom: 0.25rem;
		}

		.one.result .p-button {
			height: auto;
			padding: 0.2rem 0.4rem;
		}

		.one.result .value {
			max-width: 300px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.one.result .placeholder {
			color: #6c757d;
			font-style: italic;
		}

		@media (max-width: 1024px) {
			.result.area {
				grid-template-columns: repeat(2, 1fr);
			}
		}

		.chooser.p-selectbutton button {
			padding: 0.1rem 0.3rem; /* Smaller padding */
			font-size: 0.8rem; /* Smaller font size */
			min-width: 2rem; /* Adjust min-width */
		}

		.chooser.p-selectbutton button .p-togglebutton-label {
			font-weight: normal; /* Lighter font weight */
		}

		@media (max-width: 768px) {
			.result.area {
				flex-basis: 100%;
				grid-template-columns: 1fr;
			}

			.setting.area {
				flex-basis: 100%;
			}
		}
	</style>
</head>
<body>
<main>
	<header>
		<nav>
			<a href="文本转化.html">文本转化</a>
			<a href="数字转化.html" class="active">数字转化</a>
		</nav>
	</header>

	<section class="input area">
		<p-textarea placeholder="在此输入要处理的文本" v-model="inputText" @input="processInput" rows="5"
								autoResize></p-textarea>
		<toolbar>
			<template #end>
				<choose-group v-model="inputRadix" :options="radixOptions" @change="processInput"></choose-group>
			</template>
		</toolbar>
	</section>

	<section class="result area">
		<header>
			点击数值即可复制
			|
			数字数位过多可能会有精度问题
		</header>
		<card class="one result" @click="copyToClipboard(result.value)"
					v-for="result in results" :key="result.type">
			<template #title>
				<div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
					<span>{{ result.label }}</span>
					<choose-group v-for="setting in result.settings" :key="setting.name"
												v-model="setting.val"
												:options="setting.options"
												@change="updateResult(result, inputText, inputRadix)"
												@click.stop
												class="chooser"/>
				</div>
			</template>
			<template #content>
				<div title="点击复制" v-if="result.value"
						 style="display: flex; justify-content: space-between; align-items: center;">
					<span class="value">{{result.value}}</span>
					<p-button title="把此结果作为输入" aria-label="把此结果作为输入" @click.stop="asInput(result.value)"
										variant="outlined" serverity="info">
						<i class="pi pi-upload"></i>
					</p-button>
				</div>
				<div v-else class="placeholder">（等待输入）</div>
			</template>
		</card>
	</section>
</main>
<div>
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script src="https://unpkg.com/primevue/umd/primevue.min.js"></script>
	<script src="https://unpkg.com/@primeuix/themes/umd/aura.js"></script>
	<script src="lib/jquery-3.4.1.min.js"></script>
	<script src="lib/toastr.min.js"></script>
	<script src="lib/util.js"></script>
	<script src="lib/biz-util.js"></script>
	<script src="lib/ue.js"></script>
	<script src="lib/math.js"></script>
	<script src="lib/base64.js"></script>
</div>
<script>
	const {createApp} = Vue;

	const app = createApp({
		components: {
			'choose-group': PrimeVue.SelectButton,
			'p-button': PrimeVue.Button,
			'p-textarea': PrimeVue.Textarea,
			'p-fieldset': PrimeVue.Fieldset,
			'card': PrimeVue.Card,
			'toolbar': PrimeVue.Toolbar,
			'p-checkbox': PrimeVue.Checkbox
		},
		data() {
			return {
				inputText: '',
				inputRadix: '十进制',
				radixOptions: ['十进制', '二进制', '十六进制', '八进制'],
				results: [
					{
						type: 'dec',
						label: '十进制',
						value: '',
						handler(text, fromRadix) {
							const regex = getRegexForRadix(fromRadix);
							return text.replace(regex, num => {
								const cleanedNum = stripPrefix(num, fromRadix);
								return convertToDecimal(cleanedNum, fromRadix);
							});
						}
					},
					{
						type: 'bcd',
						label: '二进制',
						value: '',
						handler(text, fromRadix) {
							const regex = getRegexForRadix(fromRadix);
							return text.replace(regex, num => {
								const cleanedNum = stripPrefix(num, fromRadix);
								return convertToBinary(cleanedNum, fromRadix);
							});
						}
					},
					{
						type: 'hex',
						label: '十六进制',
						value: '',
						handler(text, fromRadix) {
							const regex = getRegexForRadix(fromRadix);
							return text.replace(regex, num => {
								const cleanedNum = stripPrefix(num, fromRadix);
								return convertToHex(cleanedNum, fromRadix);
							});
						}
					},
					{
						type: 'oct',
						label: '八进制',
						value: '',
						handler(text, fromRadix) {
							const regex = getRegexForRadix(fromRadix);
							return text.replace(regex, num => {
								const cleanedNum = stripPrefix(num, fromRadix);
								return convertToOctal(cleanedNum, fromRadix);
							});
						}
					},
					{
						type: 'CN-digit',
						label: '汉语数码',
						value: '',
						settings: [
							{
								name: 'zeroMode',
								label: '零的模式',
								val: '零',
								options: ['零', '〇']
							}
						],
						handler(text, fromRadix) {
							const regex = getRegexForRadix(fromRadix);
							return text.replace(regex, num => {
								const cleanedNum = stripPrefix(num, fromRadix);
								let resultValue = convertToChineseDigit(cleanedNum, fromRadix);
								if (this.settings) {
									this.settings.forEach(setting => {
										const selectedOption = setting.val;
										const otherOptions = setting.options.filter(opt => opt !== selectedOption);
										otherOptions.forEach(otherOption => {
											resultValue = resultValue.replace(new RegExp(otherOption, 'g'), selectedOption);
										});
									});
								}
								return resultValue;
							});
						}
					},
					{
						type: 'CN-num',
						label: '汉语数字',
						value: '',
						handler(text, fromRadix) {
							const regex = getRegexForRadix(fromRadix);
							return text.replace(regex, num => {
								const cleanedNum = stripPrefix(num, fromRadix);
								return ChineseNum.fromArabic(parseInt(convertToDecimal(cleanedNum, fromRadix), 10));
							});
						}
					},
					{
						type: 'CN-digit-upper',
						label: '大写汉语数码',
						value: '',
						handler(text, fromRadix) {
							const regex = getRegexForRadix(fromRadix);
							return text.replace(regex, num => {
								const cleanedNum = stripPrefix(num, fromRadix);
								return convertToChineseDigitUpper(cleanedNum, fromRadix);//todo:最终应该调用ChineseNum.digitsFromArabic(num,false);
							});
						}
					},
					{
						type: 'CN-num-upper',
						label: '大写汉语数字',
						value: '',
						handler(text, fromRadix) {
							const regex = getRegexForRadix(fromRadix);
							return text.replace(regex, num => {
								const cleanedNum = stripPrefix(num, fromRadix);
								return convertToChineseNumberUpper(cleanedNum, fromRadix);
							});
						}
					},
					{
						type: 'base62',
						label: 'Base62',
						value: '',
						handler(text, fromRadix) {
							const regex = getRegexForRadix(fromRadix);
							return text.replace(regex, num => {
								const cleanedNum = stripPrefix(num, fromRadix);
								return base62ToDecimal(cleanedNum);
							});
						}
					},
					{
						type: 'standard-communication',
						label: '标准通讯数字读音',
						value: '',
						handler(text, fromRadix) {
							const regex = getRegexForRadix(fromRadix);
							return text.replace(regex, num => {
								const cleanedNum = stripPrefix(num, fromRadix);
								return convertToStandardCommunicationDigits(cleanedNum);
							});
						}
					}
				]
			};
		},
		methods: {
			async copyToClipboard(text) {
				if (!text) {
					return;
				}
				try {
					await navigator.clipboard.writeText(text);
				} catch (err) {
					const textArea = document.createElement('textarea');
					textArea.value = text;
					document.body.appendChild(textArea);
					textArea.select();
					document.execCommand('copy');
					document.body.removeChild(textArea);
				}
				toastr.success('已复制到剪贴板');
			},
			processInput() {
				this.results.forEach(result => {
					this.updateResult(result, this.inputText, this.inputRadix);
				});
			},
			updateResult(result, inputText, inputRadixString) {
				const radixMap = {'十进制': 10, '二进制': 2, '十六进制': 16, '八进制': 8};
				const fromRadix = radixMap[inputRadixString];
				if (inputText) {
					try {
						result.value = result.handler.call(result, inputText, fromRadix);
					} catch (e) {
						console.error(`Error processing result for type: ${result.type}`, e);
						result.value = '转换出错';
					}
				} else {
					result.value = '';
				}
			},
			asInput(val) {
				this.inputText = val;
				this.processInput();
			}
		},
		mounted() {
			this.processInput();
		}
	})
	.use(PrimeVue.Config, {
		theme: {
			preset: PrimeUIX.Themes.Aura
		}
	})
	.mount('main');
</script>
</body>
</html>

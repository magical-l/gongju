<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>塔防游戏 | 工具兽</title>
	<link href="../lib/element-plus/2.10.7/index.css" rel="stylesheet">
	<link href="../resources/el-plus.css" rel="stylesheet">
	<link href="../resources/common.css" rel="stylesheet">
	<link href="../resources/layout.css" rel="stylesheet">
	<style>
		.gaming.area {
			margin-top: 20px;
			gap: 20px;
			align-items: start;
		}

		.gaming.area {
			--反叵字形-right-sidebar-max-width: 240px;
		}

		.stat-item {
			font-size: 1.1rem;
			margin-bottom: 12px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.stat-value {
			font-weight: bold;
			color: #409EFF;
		}

		.el-card__header {
			font-weight: bold;
		}

		.game-container {
			position: relative;
			width: 600px;
			height: 400px;
			background-color: #f0f2f5;
			border-radius: 10px;
			box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
			cursor: pointer;
			display: grid;
			grid-template-columns: repeat(15, 1fr);
			grid-template-rows: repeat(10, 1fr);
		}

		.cell {
			border: 1px solid rgba(0, 0, 0, 0.05);
		}

		.path-cell {
			background-color: #e0e0e0;
		}

		.carrot, .enemy, .tower, .bullet {
			position: absolute;
			transition: left 0.1s linear, top 0.1s linear;
		}

		.carrot {
			font-size: 30px;
			width: 30px;
			height: 30px;
			text-align: center;
			line-height: 30px;
			z-index: 10;
		}

		.enemy {
			width: 24px;
			height: 24px;
			background: #F56C6C;
			border-radius: 50%;
			z-index: 5;
		}

		.health-bar {
			position: absolute;
			width: 24px;
			height: 4px;
			background: #555;
			top: -8px;
			left: 0;
			border-radius: 2px;
			overflow: hidden;
		}

		.health-fill {
			height: 100%;
			background: #67C23A;
			width: 100%;
			transition: width 0.2s;
		}

		.tower {
			width: 30px;
			height: 30px;
			background: #E6A23C;
			border-radius: 50%;
			z-index: 4;
			display: flex;
			justify-content: center;
			align-items: center;
			font-size: 16px;
			color: white;
			font-weight: bold;
			border: 2px solid #d78f25;
		}

		.bullet {
			width: 8px;
			height: 8px;
			background: #f1c40f;
			border-radius: 50%;
			z-index: 6;
			box-shadow: 0 0 5px #f1c40f;
		}
	</style>
</head>
<body class="grid 反叵字形">
<header>
	<h1 class="website name">工具兽</h1>
	<nav>
		<a href="../文本转化.html">文本转化</a>
		<a href="俄罗斯方块.html">俄罗斯方块</a>
		<a href="贪吃蛇.html">贪吃蛇</a>
		<a href="塔防.html" class="active">塔防</a>
	</nav>
</header>
<main id="app" v-cloak>
	<header>
		<h2 class="game name">塔防游戏</h2>
	</header>

	<article class="gaming area , 反叵字形 grid">
		<article class="main map area , one-row item , flex items-near-center-x">
			<div class="game-container" @click="handleGameClick">
				<!-- Grid for visuals and placement -->
				<div v-for="(cell, index) in gridCells" :key="index"
					 :class="['cell', {'path-cell': cell.isPath}]">
				</div>

				<!-- Carrot -->
				<div class="carrot" :style="{ left: `${endPoint.x - 15}px`, top: `${endPoint.y - 15}px` }">🥕</div>

				<!-- Enemies -->
				<div v-for="enemy in enemies" :key="'enemy-'+enemy.id"
					 class="enemy" :style="{ left: `${enemy.x - 12}px`, top: `${enemy.y - 12}px` }">
					<div class="health-bar">
						<div class="health-fill" :style="{width: (enemy.health/enemy.maxHealth)*100 + '%'}"></div>
					</div>
				</div>

				<!-- Towers -->
				<div v-for="tower in towers" :key="'tower-'+tower.id"
					 class="tower" :style="{ left: `${tower.x - 15}px`, top: `${tower.y - 15}px` }">
					T
				</div>

				<!-- Bullets -->
				<div v-for="bullet in bullets" :key="'bullet-'+bullet.id"
					 class="bullet" :style="{ left: `${bullet.x - 4}px`, top: `${bullet.y - 4}px` }">
				</div>
			</div>
		</article>

		<aside class="gaming-situation , right-sidebar">
			<el-card header="战况">
				<div class="stat-item"><span>❤️ 生命:</span> <span class="stat-value">{{ health }}</span></div>
				<div class="stat-item"><span>💰 金币:</span> <span class="stat-value">{{ coins }}</span></div>
				<div class="stat-item"><span>🌊 波数:</span> <span class="stat-value">{{ waveDisplay }}</span></div>
			</el-card>
			<el-card header="操作" style="margin-top: 20px;">
				<el-button @click="addRandomTower" :disabled="coins < towerCost" style="width: 100%;">
					随机建塔 ({{ towerCost }}💰)
				</el-button>
				<el-button @click="restartGame" style="width: 100%; margin: 10px 0 0 0;" type="primary">
					重新开始
				</el-button>
			</el-card>
			<el-card header="说明" style="margin-top: 20px;">
				<p>点击非路径区域可花费金币建造炮塔。</p>
			</el-card>
		</aside>
	</article>

	<el-dialog v-model="showGameOverDialog" :title="gameWon ? '恭喜通关! 🎉' : '游戏结束 😢'" width="30%" center :show-close="false" :close-on-click-modal="false" :close-on-press-escape="false">
		<span>{{ gameWon ? '你成功保卫了萝卜！' : '萝卜被吃掉了，再试一次吧！' }}</span>
		<template #footer>
			<el-button type="primary" @click="restartGame">重新开始</el-button>
		</template>
	</el-dialog>
</main>

<div class="js container">
	<script src="../lib/vue/3.5.18/vue.global.js"></script>
	<script src="../lib/element-plus/2.10.7/index.full.js"></script>
</div>
<script>
	// --- Entity Classes (defined outside Vue for performance) ---
	class Enemy {
		constructor(health, speed, reward, path) {
			this.id = Date.now() + Math.random();
			this.path = path;
			this.pathIndex = 0;
			this.x = this.path[0].x;
			this.y = this.path[0].y;
			this.speed = speed;
			this.maxHealth = health;
			this.health = health;
			this.reward = reward;
		}

		update(deltaTime) {
			if (this.pathIndex >= this.path.length - 1) {
				return { reachedEnd: true };
			}

			const target = this.path[this.pathIndex + 1];
			const dx = target.x - this.x;
			const dy = target.y - this.y;
			const distance = Math.sqrt(dx * dx + dy * dy);
			const moveDistance = this.speed * (deltaTime / 16);

			if (distance < moveDistance) {
				this.x = target.x;
				this.y = target.y;
				this.pathIndex++;
			} else {
				this.x += (dx / distance) * moveDistance;
				this.y += (dy / distance) * moveDistance;
			}
			return { reachedEnd: false };
		}

		takeDamage(damage) {
			this.health -= damage;
			return this.health <= 0;
		}
	}

	class Tower {
		constructor(x, y) {
			this.id = Date.now() + Math.random();
			this.x = x;
			this.y = y;
			this.range = 120;
			this.damage = 1;
			this.fireRate = 500; // ms per shot
			this.fireCountdown = 0;
		}

		update(deltaTime, enemies, bullets) {
			this.fireCountdown -= deltaTime;
			if (this.fireCountdown <= 0) {
				const target = this.findTarget(enemies);
				if (target) {
					bullets.push({
						id: Date.now() + Math.random(),
						x: this.x,
						y: this.y,
						target: target,
						speed: 8,
						damage: this.damage
					});
					this.fireCountdown = this.fireRate;
				}
			}
		}

		findTarget(enemies) {
			let closestEnemy = null;
			let minDistance = this.range;
			for (const enemy of enemies) {
				const distance = Math.sqrt((enemy.x - this.x) ** 2 + (enemy.y - this.y) ** 2);
				if (distance < minDistance) {
					minDistance = distance;
					closestEnemy = enemy;
				}
			}
			return closestEnemy;
			}
	}

	const { createApp } = Vue;
	const app = createApp({
		data() {
			return {
				// Grid
				gridSize: { cols: 15, rows: 10, cellSize: 40 },
				gridCells: [],

				// Game State
				health: 10,
				coins: 100,
				wave: 0,
				gameOver: false,
				gameWon: false,
				spawnCount: 0,
				towerCost: 50,

				// Entities
				enemies: [],
				towers: [],
				bullets: [],

				// Path - Corrected coordinates
				pathPoints: [
					{x: 20, y: 220}, {x: 140, y: 220},
					{x: 140, y: 100}, {x: 300, y: 100},
					{x: 300, y: 300}, {x: 460, y: 300},
					{x: 460, y: 140}, {x: 580, y: 140}
				],

				// Wave Data
				wavesData: [
					{ count: 8, health: 3, speed: 1.2, interval: 1500, reward: 5 },
					{ count: 10, health: 5, speed: 1.4, interval: 1200, reward: 8 },
					{ count: 12, health: 8, speed: 1.6, interval: 1000, reward: 10 },
					{ count: 15, health: 12, speed: 1.8, interval: 800, reward: 12 },
					{ count: 20, health: 15, speed: 2.0, interval: 600, reward: 15 }
				],

				// Game Loop
				gameLoopId: null,
				lastFrameTime: 0,
				timeToNextSpawn: 0,
				timeToNextWave: 3000,
			}
		},
		computed: {
			endPoint() {
				return this.pathPoints[this.pathPoints.length - 1];
			},
			waveDisplay() {
				if (this.wave >= this.wavesData.length) return `最终波`;
				return `${this.wave + 1} / ${this.wavesData.length}`;
			},
			showGameOverDialog: {
				get() {
					return this.gameOver || this.gameWon;
				},
				set(value) {
					if (!value) {
						this.gameOver = false;
						this.gameWon = false;
					}
				}
			}
		},
		methods: {
			// --- Initialization ---
			initGame() {
				this.health = 10;
				this.coins = 100;
				this.wave = 0;
				this.spawnCount = 0;
				this.gameOver = false;
				this.gameWon = false;
				this.enemies = [];
				this.towers = [];
				this.bullets = [];
				this.timeToNextSpawn = 0;
				this.timeToNextWave = 3000; // Delay before first wave

				this.initGrid();

				this.lastFrameTime = performance.now();
				if (this.gameLoopId) cancelAnimationFrame(this.gameLoopId);
				this.gameLoopId = requestAnimationFrame(this.gameLoop);
			},
			initGrid() {
				const cells = [];
				const pathWidth = this.gridSize.cellSize / 2;

				const isPointNearLine = (px, py, x1, y1, x2, y2, maxDistance) => {
					const dx = x2 - x1, dy = y2 - y1;
					const lenSq = dx * dx + dy * dy;
					if (lenSq === 0) return Math.sqrt((px - x1) ** 2 + (py - y1) ** 2) <= maxDistance;
					let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
					t = Math.max(0, Math.min(1, t));
					const projX = x1 + t * dx, projY = y1 + t * dy;
					return Math.sqrt((px - projX) ** 2 + (py - projY) ** 2) <= maxDistance;
				};

				for (let r = 0; r < this.gridSize.rows; r++) {
					for (let c = 0; c < this.gridSize.cols; c++) {
						const x = c * this.gridSize.cellSize + this.gridSize.cellSize / 2;
						const y = r * this.gridSize.cellSize + this.gridSize.cellSize / 2;
						let isPath = false;
						for (let i = 0; i < this.pathPoints.length - 1; i++) {
							if (isPointNearLine(x, y, this.pathPoints[i].x, this.pathPoints[i].y, this.pathPoints[i+1].x, this.pathPoints[i+1].y, pathWidth)) {
								isPath = true;
								break;
							}
						}
						cells.push({ r, c, x, y, isPath, hasTower: false });
					}
				}
				this.gridCells = cells;
			},

			// --- Game Loop and Updates ---
			gameLoop(timestamp) {
				const deltaTime = timestamp - this.lastFrameTime;
				this.lastFrameTime = timestamp;

				if (!this.gameOver && !this.gameWon) {
					this.update(deltaTime);
				}

				if (!this.gameOver && !this.gameWon) {
					this.gameLoopId = requestAnimationFrame(this.gameLoop);
				}
			},
			update(deltaTime) {
				// Update Towers
				this.towers.forEach(t => t.update(deltaTime, this.enemies, this.bullets));

				// Update Bullets
				for (let i = this.bullets.length - 1; i >= 0; i--) {
					const bullet = this.bullets[i];
					if (!this.enemies.includes(bullet.target)) {
						this.bullets.splice(i, 1);
						continue;
					}
					const dx = bullet.target.x - bullet.x, dy = bullet.target.y - bullet.y;
					const dist = Math.sqrt(dx * dx + dy * dy);
					if (dist < bullet.speed) {
						if (bullet.target.takeDamage(bullet.damage)) {
							this.coins += bullet.target.reward;
							const index = this.enemies.findIndex(e => e.id === bullet.target.id);
							if (index > -1) this.enemies.splice(index, 1);
						}
						this.bullets.splice(i, 1);
					} else {
						bullet.x += (dx / dist) * bullet.speed;
						bullet.y += (dy / dist) * bullet.speed;
					}
				}

				// Update Enemies
				for (let i = this.enemies.length - 1; i >= 0; i--) {
					if (this.enemies[i].update(deltaTime).reachedEnd) {
						this.enemies.splice(i, 1);
						this.health--;
					}
				}

				// Wave and Spawning Logic
				this.handleSpawning(deltaTime);

				// Check Game Over
				if (this.health <= 0) {
					this.gameOver = true;
				}
			},
			handleSpawning(deltaTime) {
				if (this.wave >= this.wavesData.length) {
					if (this.enemies.length === 0) this.gameWon = true;
					return;
				}

				if (this.timeToNextWave > 0) {
					this.timeToNextWave -= deltaTime;
					return;
				}

				const waveInfo = this.wavesData[this.wave];
				if (this.spawnCount < waveInfo.count) {
					this.timeToNextSpawn -= deltaTime;
					if (this.timeToNextSpawn <= 0) {
						this.enemies.push(new Enemy(waveInfo.health, waveInfo.speed, waveInfo.reward, this.pathPoints));
						this.spawnCount++;
						this.timeToNextSpawn = waveInfo.interval;
					}
				} else if (this.enemies.length === 0) {
					this.wave++;
					this.spawnCount = 0;
					if (this.wave < this.wavesData.length) {
						this.timeToNextWave = 3000; // 3s for next wave
					} else {
						this.gameWon = true;
					}
				}
			},

			// --- User Actions ---
			restartGame() {
				// this.showGameOverDialog = false; // Not needed, dialog will close when gameOver/gameWon become false
				this.initGame();
			},
			placeTower(cell) {
				if (!cell || cell.isPath || cell.hasTower || this.coins < this.towerCost) return;
				this.towers.push(new Tower(cell.x, cell.y));
				cell.hasTower = true;
				this.coins -= this.towerCost;
			},
			addRandomTower() {
				const availableCells = this.gridCells.filter(c => !c.isPath && !c.hasTower);
				if (availableCells.length > 0) {
					const randomCell = availableCells[Math.floor(Math.random() * availableCells.length)];
					this.placeTower(randomCell);
				}
			},
			handleGameClick(e) {
				const rect = e.currentTarget.getBoundingClientRect();
				const x = e.clientX - rect.left;
				const y = e.clientY - rect.top;
				const col = Math.floor(x / this.gridSize.cellSize);
				const row = Math.floor(y / this.gridSize.cellSize);
				const cell = this.gridCells[row * this.gridSize.cols + col];
				this.placeTower(cell);
			}
		},
		mounted() {
			this.initGame();
		},
		beforeUnmount() {
			if (this.gameLoopId) cancelAnimationFrame(this.gameLoopId);
		}
	});
	app.use(ElementPlus);
	app.mount('#app');
</script>
</body>
</html>

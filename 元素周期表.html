<html lang="zh-CN" itemscope itemtype="http://schema.org/WebPage">
<head>

	<title itemprop="name">元素周期表 | 工具兽</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="https://unpkg.com/element-plus/dist/index.css" rel="stylesheet">

	<style>
		body > main {
			--period1-row-offset: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
		}

		.table-wrapper {
			display: flex;
		}

		.periodic-table-of-chemical-element {
			display: grid;
			flex-grow: 1;
		}

		.temperature-control {
			flex-shrink: 0;
			/*display: flex;*/
			/*flex-direction: column;*/
			/*align-items: center;*/
			/*gap: 1rem;*/
		}

		.full-width.periodic-table-of-chemical-element {
			height: 720px;
			grid-template-columns: 10px repeat(32, 1fr);
			grid-template-rows: repeat(7, 1fr);
		}

		.half-width.periodic-table-of-chemical-element {
			height: 720px;
			grid-template-columns: 10px repeat(18, 77px);
			grid-template-rows: repeat(9, 81px);
		}

		.周期序号 {
			grid-column: 1;
			border: 1px solid #ccc;
		}

		.周期1 {grid-row: calc(1 + var(--period1-row-offset));}
		.周期2 {grid-row: calc(2 + var(--period1-row-offset));}
		.周期3 {grid-row: calc(3 + var(--period1-row-offset));}
		.周期4 {grid-row: calc(4 + var(--period1-row-offset));}
		.周期5 {grid-row: calc(5 + var(--period1-row-offset));}
		.周期6 {grid-row: calc(6 + var(--period1-row-offset));}
		.周期7 {grid-row: calc(7 + var(--period1-row-offset));}

		.half-width .周期7 {grid-row-start: calc(8 + var(--period1-row-offset));}
		.half-width .周期6.周期序号, .half-width .周期7.周期序号 {
			grid-row-end: span 2;
		}

		.族 {
			grid-row: 1;
			border: 1px solid #ccc;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.硼族元素 { grid-column: -7; }
		.碳族元素 { grid-column: -6; }
		.氮族元素 { grid-column: -5; }
		.氧族元素 { grid-column: -4; }
		.卤素 { grid-column: -3; }

		.族 p {
			padding: 0;
			margin: 0;
		}

		.one.element {
			position: relative;
			border: 1px solid #ccc;
			background-color: #ccc; /* 默认颜色 */
			display: flex;
			flex-direction: column;
			transition: all 0.2s ease-in-out;
		}

		.half-width .镧系, .half-width .锕系 {
			grid-row-end: span 2;
			justify-content: end;
		}

		.half-width .镧系 .element.info, .half-width .锕系 .element.info {
			height: 50%; /* 否则占不满一行的格子 */
		}

		.half-width #镧, .half-width #锕 {
			clip-path: polygon(0% 100%, 100% 100%, 100% 10%, 50% 5%, 0% 10%);
		}

		.half-width #镧::before { content: '57~71\A  镧系'; }
		.half-width #锕::before { content: '89~103\A    锕系'; }

		.half-width #镧::before, .half-width #锕::before {
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			white-space: pre;
		}

		.碱金属.element { background-color: #ffadad; }
		.碱土金属.element { background-color: #ffd6a5; }
		.过渡金属.element { background-color: #fdffb6; }
		.镧系.element { background-color: #caffbf; }
		.锕系.element { background-color: #9bf6ff; }
		.类金属.element { background-color: #a0c4ff; }
		.贫金属.element { background-color: #bdb2ff; }
		.活泼非金属.element { background-color: #ffc6ff; }
		.稀有气体.element { background-color: #f1f1f1; }

		.element.info {
			display: flex;
			flex-direction: column;
			height: 100%;
		}

		.element.info > header {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.element.info p {
			margin: 0;
			padding: 1px 2px;
			line-height: 1.2;
		}

		.element.name {
			flex-grow: 1;
			display: flex;
			justify-content: center;
			align-items: center;
			font-size: 1.6em;
			padding: 0;
		}

		.element > footer {
			display: flex;
			justify-content: flex-end;
			align-items: center;
			padding: 0 4px 2px;
			height: 16px;
			justify-content: space-around; /* 分散对齐图标 */
			align-items: center;
		}

		.element > footer > .with.icon::after {
			font-style: normal;
			font-size: 0.8em;
			line-height: 1;
		}

		[title='人造元素'].with.icon::after {content: '🧪';font-size: 0.8em;}
		[title='放射性元素'].with.icon::after {content: '☢️';font-size: 0.8em;}
		[title='铁磁性元素'].with.icon::after {content: '🧲';font-size: 0.8em;}
		[title='稀土元素'].with.icon::after {content: '💎';font-size: 0.8em;}
		[title='贵金属'].with.icon::after {content: '💰';font-size: 0.8em;}
		[title='气体'].with.icon::after {content: '🌀';}
		[title='液体'].with.icon::after {content: '💧';}
		[title='固体'].with.icon::after {content: '🪨';}

		.toolbar {
			display: flex;
			align-items: center;
			padding: 0.5rem 1rem;
			gap: 1rem;
			border-bottom: 1px solid #dcdfe6;
			flex-wrap: wrap;
		}

		.element.filter {
			--el-checkbox-button-checked-bg-color: transparent;
			--el-button-bg-color: transparent;
			--el-checkbox-button-checked-text-color: var(--el-color-primary);
		}

		.filtering.碱金属 .one.element:not(.碱金属),
		.filtering.碱土金属 .one.element:not(.碱土金属),
		.filtering.过渡金属 .one.element:not(.过渡金属),
		.filtering.贫金属 .one.element:not(.贫金属),
		.filtering.类金属 .one.element:not(.类金属),
		.filtering.活泼非金属 .one.element:not(.活泼非金属),
		.filtering.稀有气体 .one.element:not(.稀有气体),
		.filtering.放射性元素 .one.element:not(.放射性元素),
		.filtering.人造元素 .one.element:not(.人造元素),
		.filtering.稀土元素 .one.element:not(.稀土元素),
		.filtering.铁磁性元素 .one.element:not(.铁磁性元素),
		.filtering.贵金属 .one.element:not(.贵金属) {
			opacity: 0.5;
		}

		.element.detail.area {
			grid-column: 4 / 14;
			grid-row: 1 / 4;
			width: 100%;
			height: 100%;
			padding: 20px;
		}

		.element.detail.card {
			width: 100%;
			height: 100%;
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 2px 12px 0 rgba(0, 0, 0, .1);
			display: flex;
			gap: 20px;
			align-items: flex-start;
		}

		.element.detail.card .element.info {
			width: 120px;
			height: 120px;
			flex-shrink: 0;
		}

		.element.detail.card footer {
			flex-direction: column;
			align-items: flex-start;
			gap: 4px;
			height: auto;
			justify-content: flex-start;
		}

		.tag-item {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.element-properties {
			margin: 0;
			padding: 0;
			display: grid;
			grid-template-columns: auto 1fr;
			gap: 8px 12px;
			align-items: center;
		}

		.element-properties dt {
			font-weight: bold;
			text-align: right;
			color: #606266;
		}

		.element-properties dd {
			margin: 0;
			color: #303133;
		}
	</style>
</head>
<body class="反叵字形">
<main>
	<div class="toolbar">
		<el-radio-group v-model="layout">
			<el-radio-button v-for="opt in widthModes" :key="opt.value" :label="opt.value" size="small">{{ opt.label }}
			</el-radio-button>
		</el-radio-group>
		<el-checkbox-group v-model="filtering" size="small">
			<el-checkbox-button class="element filter maybe with icon" :class="f.name" :title="f.name" :value="f.name"
													v-for="f in filters" :key="f.name"
													@mouseenter="hoverFilter=f.name" @mouseleave="hoverFilter=null">
				{{ f.name }}
			</el-checkbox-button>
		</el-checkbox-group>
	</div>
	<div class="table-wrapper">
		<article class="periodic-table-of-chemical-element" :class="tableClasses">
			<section class="周期序号" :class="`周期`+n" v-for="n in 7" :key="n">
				<p>{{n}}</p>
			</section>

			<!--<section class="族" v-for="group in groups" :key="group.name" :class="group.name">
				<p>{{group.name}}</p>
			</section>-->

			<section :id="element.name" class="one element"
							 :class="[...element.tags, `周期`+element.period]"
							 :style="getElementStyle(element)"
							 v-for="element in elements" :key="element.id" @click="curElement=element">
				<div class="element info">
					<header>
						<p class="element id">{{element.id}}</p>
						<p class="element symbol">{{element.symbol}}</p>
					</header>
					<p class="element name">{{element.name}}</p>
					<footer>
						<span class="with icon" v-for="tag in element.tags" :title="tag"></span>
						<span class="with icon" :title="getElementPhase(element)"></span>
					</footer>
				</div>
			</section>

			<section class="element detail area" v-if="curElement">
				<div class="element detail card" :class="curElement.tags">
					<div class="element info">
						<header>
							<p class="element id">{{curElement.id}}</p>
							<p class="element symbol">{{curElement.symbol}}</p>
						</header>
						<p class="element name">{{curElement.name}}</p>
						<footer>
							<div class="tag-item" v-for="tag in curElement.tags" :key="tag">
								<span class="with icon" :title="tag"></span>
								<span>{{tag}}</span>
							</div>
						</footer>
					</div>
					<dl class="element-properties">
						<dt>熔点</dt>
						<dd>{{curElement.熔点}} °C</dd>
						<dt>沸点</dt>
						<dd>{{curElement.沸点}} °C</dd>
					</dl>
				</div>
			</section>
		</article>
		<aside class="temperature-control">
			<el-slider vertical v-model="temperature" :min="-273" :max="6000" height="100%" marks="{0:'0°'}"></el-slider>
		</aside>
	</div>
</main>

</div>

				if (this.layout) {

				}

				if (window.innerWidth < threshold) {
					this.layout = 'half-width';
				} else {
					this.layout = 'full-width';
				}
			},
			getElementStyle(element) {
				return {
					'grid-column': element.col > 0 ? element.col + 1 : element.col - 1
				};

				const bp = parseFloat(element.沸点);

					return '固体';
				} else if (this.temperature >= mp && (isNaN(bp) || this.temperature < bp)) {
					return '液体';
				} else if (!isNaN(bp) && this.temperature >= bp) {
					return '气体';
				}
				return '未知';
			}
		},

		},

		}

<!DOCTYPE html>
<html lang="zh-CN" itemscope itemtype="http://schema.org/WebPage">
<head>
	<meta charset="UTF-8">
	<title itemprop="name">数字格式转换</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="在线数字格式转换工具，支持进制转换、汉语数字转换等功能" itemprop="description">
	<meta name="keywords" content="数字格式转换,进制转换,汉语数字,二进制,十六进制">
	<meta name="author" content="数字格式转换">

	<!-- 预加载关键资源 -->
	<link rel="preload" href="lib/jquery-3.4.1.min.js" as="script">
	<link rel="preload" href="resources/math.js" as="script">

	<link href="https://cdn.jsdelivr.net/npm/primeicons/primeicons.css" rel="stylesheet">
	<link href="lib/toastr.min.css" rel="stylesheet">
	<link href="resources/style.css" rel="stylesheet">
	<style>
		.input.area {
			position: relative;
		}

		.input.area .input.radix.chooser {
			position: absolute;
			bottom: 10px;
			right: 10px;
			z-index: 1;
		}
	</style>
</head>
<body>
<header>
	<h1 class="name">在线工具</h1>
	<nav>
		<a href="文本转化.html">文本转化</a>
		<a href="数字转化.html" class="active">数字转化</a>
		<a href="格子盘.html">格子盘</a>
		<a href="svg转图标.html">SVG转图标</a>
		<a href="拼音/拼音.html">拼音</a>
	</nav>
</header>
<main>
	<section class="input area">
		<p-textarea placeholder="在此输入要处理的文本，处理文本中的数字，非数字部分将保留原样。" rows="5" autoResize
								v-model="inputText" @input="processInput"></p-textarea>
		<choose-group class="input radix chooser" v-model="inputRadix" :options="radixOptions"
									@change="processInput"></choose-group>
	</section>

	<section class="transfer result area">
		<header>
			<span class="note">* 点击数值即可复制。</span>
			<span class="note" v-if="inputRadix==='二进制'"> * 除<strong>0、1</strong>外其他数字会被当作普通字符</span>
			<span class="note" v-if="inputRadix==='八进制'"> * <strong>8、9</strong>会被当作普通字符</span>
			<span class="note"
						v-if="inputRadix==='十六进制'"> * <strong>a、b、c、d、e、f（不分大小写）</strong>会被当作数字字符</span>
		</header>
		<card class="one result" @click="copyToClipboard(result.value)" v-for="(result,label) in results" :key="label">
			<template #title>
				<header>
					<span>{{ label }}</span>
					<span>
						<choose-group class="chooser" v-for="(setting,settingName) in result.settings" :key="settingName"
													v-model="setting.val" :options="setting.options"
													@click.stop @change="updateResult(result, inputText, inputRadix)"/>
					</span>
				</header>
			</template>
			<template #content>
				<article title="点击复制" v-if="result.value">
					<span class="value text-maybe-too-long">{{result.value}}</span>
					<p-button title="把此结果作为输入" aria-label="把此结果作为输入" @click.stop="asInput(result.value)"
										variant="outlined" serverity="info">
						<i class="pi pi-upload"></i>
					</p-button>
				</article>
				<div v-else class="placeholder">（等待输入）</div>
			</template>
		</card>
	</section>
</main>
<footer>
	<div class="qr-code">
		<img src="resources/支付宝收款码.jpg" alt="支付宝收款码" title="赞助一下">
		<span>赞助一下</span>
	</div>
	<div>
		<p>&copy; 2025 数字格式转换工具. All rights reserved.</p>
		<p>一个简单实用的在线数字格式转换工具，支持多种进制转换、汉语数字转换等功能，助您高效处理数字数据。</p>
		<p>反馈或建议请联系：<a href="mailto:lwj621@sohu.com">lwj621@sohu.com</a></p>
	</div>
</footer>
<div>
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script src="https://unpkg.com/primevue/umd/primevue.min.js"></script>
	<script src="https://unpkg.com/@primeuix/themes/umd/aura.js"></script>
	<script src="lib/jquery-3.4.1.min.js"></script>
	<script src="lib/toastr.min.js"></script>
	<script src="resources/util.js"></script>
	<script src="resources/biz-util.js"></script>
	<script src="resources/ue.js"></script>
	<script src="resources/math.js"></script>

</div>
<script>
	const {createApp} = Vue;

	const results = {
		'十进制': {
			value: '',
			convert(text, fromRadix) {
				if (fromRadix === 10) {
					return text;
				}
				const regex = getRegexForRadix(fromRadix);
				return text.replace(regex, part => {
					const cleanedNum = stripPrefix(part, fromRadix);
					return convertToDecimal(cleanedNum, fromRadix);
				});
			}
		},
		'二进制': {
			value: '',
			convert(text, fromRadix) {
				if (fromRadix === 2) {
					return text;
				}
				const regex = getRegexForRadix(fromRadix);
				return text.replace(regex, part => {
					const cleanedNum = stripPrefix(part, fromRadix);
					const decimal = convertToDecimal(cleanedNum, fromRadix);
					return decimal ? parseInt(decimal).toString(2) : '';
				});
			}
		},
		'十六进制': {
			value: '',
			settings: {
				'大小写': {
					val: '大写',
					options: ['大写', '小写'],
					handle(s) {
						return this.val === '大写' ? s.toUpperCase() : s.toLowerCase();
					}
				}
			},
			convert(text, fromRadix) {
				if (fromRadix === 16) {
					return text;
				}
				const regex = getRegexForRadix(fromRadix);
				return text.replace(regex, part => {
					const cleanedNum = stripPrefix(part, fromRadix);
					const decimal = convertToDecimal(cleanedNum, fromRadix);
					const converted = decimal ? parseInt(decimal).toString(16).toUpperCase() : '';
					return Object.values(this.settings).reduce((result, setting) => setting.handle(result), converted);
				});
			}
		},
		'八进制': {
			value: '',
			convert(text, fromRadix) {
				if (fromRadix === 8) {
					return text;
				}
				const regex = getRegexForRadix(fromRadix);
				return text.replace(regex, part => {
					const cleanedNum = stripPrefix(part, fromRadix);
					const decimal = convertToDecimal(cleanedNum, fromRadix);
					return decimal ? parseInt(decimal).toString(8) : '';
				});
			}
		},
		'汉语数码': {
			value: '',
			settings: {
				'零的模式': {
					val: '零',
					options: ['零', '〇'],
					handle(s) {
						return this.val === '〇' ? s.replace(/零/g, '〇') : s;
					}
				}
			},
			convert(text, fromRadix) {
				return text.replace(/\d/g, part => {
					const converted = ChineseNum.digitsFromArabic(part);
					return Object.values(this.settings).reduce((result, setting) => setting.handle(result), converted);
				});
			}
		},
		'汉语数字': {
			value: '',
			convert(text, fromRadix) {
				const regex = getRegexForRadix(fromRadix);
				return text.replace(regex, part => {
					const cleanedNum = stripPrefix(part, fromRadix);
					return ChineseNum.fromArabic(parseInt(convertToDecimal(cleanedNum, fromRadix), 10));
				});
			}
		},
		'大写汉语数码': {
			value: '',
			convert(text, fromRadix) {
				return ChineseNum.toUpperCase(results['汉语数码'].convert(text, fromRadix).replace(/〇/g, '零'));
			}
		},
		'大写汉语数字': {
			value: '',
			convert(text, fromRadix) {
				return ChineseNum.toUpperCase(results['汉语数字'].convert(text, fromRadix));
			}
		},

		'标准通讯数字读法': {
			value: '',
			convert(text, fromRadix) {
				return text.replace(/\d/g, part => {
					const communicationDigitsMap = ['洞', '幺', '两', '三', '四', '五', '六', '拐', '八', '九'];
					return communicationDigitsMap[parseInt(part)];
				});
			}
		},
		'筛出数字': {
			value: '',
			settings: {
				'弃留': {
					val: '留',
					options: ['留', '弃']
				},
				'留空': {
					val: '留空',
					options: ['留空', '不留']
				}
			},
			convert(text, fromRadix) {
				const separator = this.settings.留空.val === '留空' ? ' ' : '';
				const regex = getRegexForRadix(fromRadix);
				if (this.settings.弃留.val === '留') {
					const matches = text.match(regex) ?? [];
					return matches.join(separator);
				} else {
					return text.replace(regex, separator);
				}
			}
		}
	};

	const app = createApp({
		components: {
			'choose-group': PrimeVue.SelectButton,
			'p-button': PrimeVue.Button,
			'p-textarea': PrimeVue.Textarea,
			'p-fieldset': PrimeVue.Fieldset,
			'card': PrimeVue.Card,
			'toolbar': PrimeVue.Toolbar,
			'p-checkbox': PrimeVue.Checkbox
		},
		data() {
			return {
				inputText: '',
				inputRadix: '十进制',
				radixOptions: ['十进制', '二进制', '十六进制', '八进制'],
				results
			};
		},
		methods: {
			async copyToClipboard(text) {
				if (!text) {
					return;
				}
				try {
					await navigator.clipboard.writeText(text);
				} catch (err) {
					const textArea = document.createElement('textarea');
					textArea.value = text;
					document.body.appendChild(textArea);
					textArea.select();
					document.body.removeChild(textArea);
				}
				toastr.success('已复制到剪贴板');
			},
			processInput() {
				Object.values(this.results).forEach(result => {
					this.updateResult(result, this.inputText, this.inputRadix);
				});
			},
			updateResult(result, inputText, inputRadixString) {
				const radixMap = {'十进制': 10, '二进制': 2, '十六进制': 16, '八进制': 8};
				const fromRadix = radixMap[inputRadixString];
				if (inputText) {
					try {
						result.value = result.convert.call(result, inputText, fromRadix);
					} catch (e) {
						console.error(`Error processing result for type: ${result.type}`, e);
						result.value = '转换出错';
					}
				} else {
					result.value = '';
				}
			},
			asInput(val) {
				this.inputText = val;
				this.processInput();
			}
		},
		mounted() {
			this.processInput();
		}
	})
	.use(PrimeVue.Config, {
		theme: {
			preset: PrimeUIX.Themes.Aura
		}
	})
	.mount('main');
</script>
</body>
</html>

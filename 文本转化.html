<!DOCTYPE html>
<html lang="zh-CN" itemscope itemtype="http://schema.org/WebPage">
<head>
	<meta charset="UTF-8">
	<title itemprop="name">文本格式转换</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="在线文本格式转换工具，支持URI编码解码、Base64转换、MD5加密、进制转换等功能"
				itemprop="description">
	<meta name="keywords" content="文本格式转换,URI编码,Base64,MD5,进制转换">
	<meta name="author" content="文本格式转换">

	<!-- 预加载关键资源 -->
	<link rel="preload" href="lib/jquery-3.4.1.min.js" as="script">
	<link rel="preload" href="https://unpkg.com/vue@3/dist/vue.global.js" as="script">
	<link rel="preload" href="https://unpkg.com/primevue/umd/primevue.min.js" as="script">
	<link rel="preload" href="https://unpkg.com/@primeuix/themes/umd/aura.js" as="script">

	<link href="https://cdn.jsdelivr.net/npm/primeicons/primeicons.css" rel="stylesheet">
	<link href="lib/toastr.min.css" rel="stylesheet">
	<link href="resources/style.css" rel="stylesheet">
</head>
<body>
<header>
	<h1 class="name" title="工具人（gongju.ren）域名太贵买不起">工具兽</h1>
	<nav>
		<a href="文本转化.html" class="active">文本转化</a>
		<a href="数字转化.html">数字转化</a>
		<a href="格子盘.html">格子盘</a>
		<a href="svg转图标.html">SVG转图标</a>
		<a href="拼音/拼音.html">拼音</a>
	</nav>
</header>
<main>
	<section class="input area">
		<p-textarea placeholder="在此输入要处理的文本" rows="5" autoResize
								v-model="inputText" @input="processInput"></p-textarea>
	</section>

	<section class="transfer result area">
		<header>
			点击文本即可复制
		</header>
		<card class="one result" @click="copyToClipboard(result.value)" v-for="(result,label) in results" :key="label">
			<template #title>
				<header>
					<span>{{ label }}</span>
					<span>
						<choose-group class="chooser" v-for="(setting,settingName) in result.settings" :key="settingName"
													v-model="setting.val" :options="setting.options"
													@click.stop @change="updateResult(result, inputText)"/>
					</span>
				</header>
			</template>
			<template #content>
				<article title="点击复制" v-if="result.value">
					<span class="value text-maybe-too-long">{{result.value}}</span>
					<p-button title="把此结果作为输入" aria-label="把此结果作为输入" @click.stop="asInput(result.value)"
										variant="outlined" serverity="info">
						<i class="pi pi-upload"></i>
					</p-button>
				</article>
				<div v-else class="placeholder">（等待输入）</div>
			</template>
		</card>
	</section>
</main>
<footer>
	<div class="qr-code">
		<img src="resources/支付宝收款码.jpg" alt="支付宝收款码" title="赞助一下">
		<span>赞助一下</span>
	</div>
	<div>
		<p>&copy; 2025 工具兽版权所有 All rights reserved.</p>
		<p>反馈或建议请联系：<a href="mailto:lwj621@sohu.com">lwj621@sohu.com</a></p>
	</div>
</footer>
<div>
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script src="https://unpkg.com/primevue/umd/primevue.min.js"></script>
	<script src="https://unpkg.com/@primeuix/themes/umd/aura.js"></script>
	<script src="lib/jquery-3.4.1.min.js"></script>
	<script src="lib/toastr.min.js"></script>
	<script src="resources/util.js"></script>
	<script src="resources/biz-util.js"></script>
	<script src="resources/ue.js"></script>
	<script src="resources/math.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/js-base64@3.7.7/base64.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/js-md5@0.8.3/src/md5.min.js"></script>
</div>
<script>
	const {createApp} = Vue;

	const results = {
		'MD5': {
			value: '',
			convert: md5
		},
		'Base64编码': {
			value: '',
			convert: Base64.encode
		},
		'Base64解码': {
			value: '',
			convert: str => {
				try {
					return Base64.decode(str)
				} catch (e) {
					return '非Base64编码';
				}
			}
		},
		'URI编码': {
			value: '',
			convert: encodeURI
		},
		'URI解码': {
			value: '',
			convert: decodeURI
		},
		'URI参数编码': {
			value: '',
			convert: encodeURIComponent
		},
		'URI参数解码': {
			value: '',
			convert: decodeURIComponent
		}
	};

	const app = createApp({
		components: {
			'choose-group': PrimeVue.SelectButton,
			'p-button': PrimeVue.Button,
			'p-textarea': PrimeVue.Textarea,
			'p-fieldset': PrimeVue.Fieldset,
			'card': PrimeVue.Card,
			'toolbar': PrimeVue.Toolbar,
			'p-checkbox': PrimeVue.Checkbox
		},
		data() {
			return {
				inputText: '',
				results
			};
		},
		methods: {
			async copyToClipboard(text) {
				if (!text) {
					return;
				}
				try {
					await navigator.clipboard.writeText(text);
				} catch (err) {
					const textArea = document.createElement('textarea');
					textArea.value = text;
					document.body.appendChild(textArea);
					textArea.select();
					document.body.removeChild(textArea);
				}
				toastr.success('已复制到剪贴板');
			},
			processInput() {
				Object.values(this.results).forEach(result => {
					this.updateResult(result, this.inputText);
				});
			},
			updateResult(result, inputText) {
				if (inputText) {
					try {
						result.value = result.convert.call(result, inputText);
					} catch (e) {
						console.error(`Error processing result:`, e);
						result.value = '转换出错';
					}
				} else {
					result.value = '';
				}
			},
			asInput(val) {
				this.inputText = val;
				this.processInput();
			}
		},
		mounted() {
			this.processInput();
		}
	})
	.use(PrimeVue.Config, {
		theme: {
			preset: PrimeUIX.Themes.Aura
		}
	})
	.mount('main');
</script>
</body>
</html>

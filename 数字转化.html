<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<title>数字转化</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="在线数字处理工具，支持进制转换、汉语数字转换等功能">
	<meta name="keywords" content="数字处理,进制转换,汉语数字,二进制,十六进制">
	<meta name="author" content="数字转化">

	<!-- 预加载关键资源 -->
	<link rel="preload" href="lib/jquery-3.4.1.min.js" as="script">
	<link rel="preload" href="lib/math.js" as="script">

	<link href="https://cdn.jsdelivr.net/npm/primeicons/primeicons.css" rel="stylesheet">
	<link href="lib/toastr.min.css?v=0204a" rel="stylesheet"><!-- 提示框 -->
	<link href="lib/iconfont/iconfont.css" rel="stylesheet">
	<link href="lib/style.css?v=0229b" rel="stylesheet">
	<style>
		body {
			font-family: sans-serif;
		}

		main {
			display: flex;
			flex-wrap: wrap;
			align-items: start;
			gap: 1rem;
		}

		header,
		.input.area {
			flex-basis: 100%;
		}

		main > header {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		main nav a {
			margin-left: 1rem;
			text-decoration: none;
			color: #333;
		}

		main nav a.active {
			font-weight: bold;
			border-bottom: 2px solid #007bff;
		}

		.input.area {
			flex-basis: 100%;
			position: relative;
		}

		.input.area textarea {
			width: 100%;
			min-height: 100px;
			height: 100px;
			box-sizing: border-box;
			padding-bottom: 40px;
		}

		.input.area .input.radix.chooser {
			position: absolute;
			bottom: 10px;
			right: 10px;
			z-index: 1;
		}

		.setting.area {
			flex: 1;
			min-width: 280px;
		}

		.one.setting {
			display: flex;
			align-items: center;
			gap: 1rem;
			margin-bottom: 1rem;
		}

		.result.area {
			flex: 4;
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			align-items: start;
			gap: 1rem;
		}

		.result.area > header {
			grid-column: 1 / -1;
			color: #666;
			font-style: italic;
		}

		.one.result {
			cursor: pointer;
			transition: background-color 0.2s;
		}

		.one.result:hover {
			background-color: #f0f8ff;
		}

		.one.result header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
		}

		.one.result .p-card-body {
			padding: 0.75rem;
		}

		.one.result .p-card-content {
			padding: 0;
		}

		.one.result .p-card-title {
			font-size: 1rem;
			margin-bottom: 0.25rem;
		}

		.one.result .p-button {
			height: auto;
			padding: 0.2rem 0.4rem;
		}

		.one.result .value {
			max-width: 300px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.one.result .placeholder {
			color: #6c757d;
			font-style: italic;
		}

		@media (max-width: 1024px) {
			.result.area {
				grid-template-columns: repeat(2, 1fr);
			}
		}

		.chooser.p-selectbutton button {
			padding: 0.1rem 0.3rem;
			font-size: 0.8rem;
			min-width: 2rem;
		}

		.chooser.p-selectbutton button .p-togglebutton-label {
			font-weight: normal;
		}

		@media (max-width: 768px) {
			.result.area {
				flex-basis: 100%;
				grid-template-columns: 1fr;
			}

			.setting.area {
				flex-basis: 100%;
			}
		}

		.note strong {
			color: red;
		}
	</style>
</head>
<body>
<main>
	<header>
		<nav>
			<a href="文本转化.html">文本转化</a>
			<a href="数字转化.html" class="active">数字转化</a>
		</nav>
	</header>

	<section class="input area">
		<div style="position: relative;">
			<p-textarea placeholder="在此输入要处理的文本，转换文本中的数字，其他字符保留。" rows="5" autoResize
									v-model="inputText" @input="processInput"></p-textarea>
			<choose-group class="input radix chooser" v-model="inputRadix" :options="radixOptions"
										@change="processInput"></choose-group>
		</div>
	</section>

	<section class="result area">
		<header>
			<span class="note">* 点击数值即可复制。</span>
			<span class="note" v-if="inputRadix==='二进制'"> * 除<strong>0、1</strong>外其他数字会被当作普通字符</span>
			<span class="note" v-if="inputRadix==='八进制'"> * <strong>8、9</strong>会被当作普通字符</span>
			<span class="note"
						v-if="inputRadix==='十六进制'"> * <strong>a、b、c、d、e、f（不分大小写）</strong>会被当作数字字符</span>
		</header>
		<card class="one result" @click="copyToClipboard(result.value)"
					v-for="(result,label) in results" :key="result.type">
			<template #title>
				<header>
					<span>{{ label }}</span>
					<choose-group class="chooser" v-for="(setting,settingName) in result.settings" :key="settingName"
												v-model="setting.val" :options="setting.options"
												@click.stop @change="updateResult(result, inputText, inputRadix)"/>
				</header>
			</template>
			<template #content>
				<div title="点击复制" v-if="result.value"
						 style="display: flex; justify-content: space-between; align-items: center;">
					<span class="value">{{result.value}}</span>
					<p-button title="把此结果作为输入" aria-label="把此结果作为输入" @click.stop="asInput(result.value)"
										variant="outlined" serverity="info">
						<i class="pi pi-upload"></i>
					</p-button>
				</div>
				<div v-else class="placeholder">（等待输入）</div>
			</template>
		</card>
	</section>
</main>
<div>
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script src="https://unpkg.com/primevue/umd/primevue.min.js"></script>
	<script src="https://unpkg.com/@primeuix/themes/umd/aura.js"></script>
	<script src="lib/jquery-3.4.1.min.js"></script>
	<script src="lib/toastr.min.js"></script>
	<script src="lib/util.js"></script>
	<script src="lib/biz-util.js"></script>
	<script src="lib/ue.js"></script>
	<script src="lib/math.js"></script>
	<script src="lib/base64.js"></script>
</div>
<script>
	const {createApp} = Vue;

	const results = {
		'十进制': {
			value: '',
			convert(text, fromRadix) {
				if (fromRadix === 10) {
					return text;
				}
				const regex = getRegexForRadix(fromRadix);
				return text.replace(regex, part => {
					const cleanedNum = stripPrefix(part, fromRadix);
					return convertToDecimal(cleanedNum, fromRadix);
				});
			}
		},
		'二进制': {
			value: '',
			convert(text, fromRadix) {
				if (fromRadix === 2) {
					return text;
				}
				const regex = getRegexForRadix(fromRadix);
				return text.replace(regex, part => {
					const cleanedNum = stripPrefix(part, fromRadix);
					const decimal = convertToDecimal(cleanedNum, fromRadix);
					return decimal ? parseInt(decimal).toString(2) : '';
				});
			}
		},
		'十六进制': {
			value: '',
			settings: {
				'大小写': {
					val: '大写',
					options: ['大写', '小写'],
					handle(s) {
						return this.val === '大写' ? s.toUpperCase() : s.toLowerCase();
					}
				}
			},
			convert(text, fromRadix) {
				if (fromRadix === 16) {
					return text;
				}
				const regex = getRegexForRadix(fromRadix);
				return text.replace(regex, part => {
					const cleanedNum = stripPrefix(part, fromRadix);
					const decimal = convertToDecimal(cleanedNum, fromRadix);
					const converted = decimal ? parseInt(decimal).toString(16).toUpperCase() : '';
					return Object.values(this.settings).reduce((result, setting) => setting.handle(result), converted);
				});
			}
		},
		'八进制': {
			value: '',
			convert(text, fromRadix) {
				if (fromRadix === 8) {
					return text;
				}
				const regex = getRegexForRadix(fromRadix);
				return text.replace(regex, part => {
					const cleanedNum = stripPrefix(part, fromRadix);
					const decimal = convertToDecimal(cleanedNum, fromRadix);
					return decimal ? parseInt(decimal).toString(8) : '';
				});
			}
		},
		'汉语数码': {
			value: '',
			settings: {
				'零的模式': {
					val: '零',
					options: ['零', '〇'],
					handle(s) {
						return this.val === '〇' ? s.replace(/零/g, '〇') : s;
					}
				}
			},
			convert(text, fromRadix) {
				return text.replace(/\d/g, part => {
					const converted = ChineseNum.digitsFromArabic(part);
					return Object.values(this.settings).reduce((result, setting) => setting.handle(result), converted);
				});
			}
		},
		'汉语数字': {
			value: '',
			convert(text, fromRadix) {
				const regex = getRegexForRadix(fromRadix);
				return text.replace(regex, part => {
					const cleanedNum = stripPrefix(part, fromRadix);
					return ChineseNum.fromArabic(parseInt(convertToDecimal(cleanedNum, fromRadix), 10));
				});
			}
		},
		'大写汉语数码': {
			value: '',
			convert(text, fromRadix) {
				return ChineseNum.toUpperCase(results['汉语数码'].convert(text, fromRadix).replace(/〇/g, '零'));
			}
		},
		'大写汉语数字': {
			value: '',
			convert(text, fromRadix) {
				return ChineseNum.toUpperCase(results['汉语数字'].convert(text, fromRadix));
			}
		},
		// 'Base62': {
		// 	value: '',
		// 	convert(text, fromRadix) {
		// 		const regex = getRegexForRadix(fromRadix);
		// 		return text.replace(regex, part => {
		// 			const cleanedNum = stripPrefix(part, fromRadix);
		// 			return base62ToDecimal(cleanedNum);
		// 		});
		// 	}
		// },
		'标准通讯数字读法': {
			value: '',
			convert(text, fromRadix) {
				return text.replace(/\d/g, part => {
					const communicationDigitsMap = ['洞', '幺', '两', '三', '四', '五', '六', '拐', '八', '九'];
					return communicationDigitsMap[parseInt(part)];
				});
			}
		},
		'筛出数字': {
			value: '',
			settings: {
				'弃留': {
					val: '留',
					options: ['留', '弃']
				},
				'留空': {
					val: '留空',
					options: ['留空', '不留']
				}
			},
			convert(text, fromRadix) {
				const separator = this.settings.留空.val === '留空' ? ' ' : '';
				const regex = getRegexForRadix(fromRadix);
				if (this.settings.弃留.val === '留') {
					const matches = text.match(regex) ?? [];
					return matches.join(separator);
				} else {
					return text.replace(regex, separator);
				}
			}
		}
	};

	const app = createApp({
		components: {
			'choose-group': PrimeVue.SelectButton,
			'p-button': PrimeVue.Button,
			'p-textarea': PrimeVue.Textarea,
			'p-fieldset': PrimeVue.Fieldset,
			'card': PrimeVue.Card,
			'toolbar': PrimeVue.Toolbar,
			'p-checkbox': PrimeVue.Checkbox
		},
		data() {
			return {
				inputText: '',
				inputRadix: '十进制',
				radixOptions: ['十进制', '二进制', '十六进制', '八进制'],
				results
			};
		},
		methods: {
			async copyToClipboard(text) {
				if (!text) {
					return;
				}
				try {
					await navigator.clipboard.writeText(text);
				} catch (err) {
					const textArea = document.createElement('textarea');
					textArea.value = text;
					document.body.appendChild(textArea);
					textArea.select();
					document.execCommand('copy');
					document.body.removeChild(textArea);
				}
				toastr.success('已复制到剪贴板');
			},
			processInput() {
				Object.values(this.results).forEach(result => {
					this.updateResult(result, this.inputText, this.inputRadix);
				});
			},
			updateResult(result, inputText, inputRadixString) {
				const radixMap = {'十进制': 10, '二进制': 2, '十六进制': 16, '八进制': 8};
				const fromRadix = radixMap[inputRadixString];
				if (inputText) {
					try {
						result.value = result.convert.call(result, inputText, fromRadix);
					} catch (e) {
						console.error(`Error processing result for type: ${result.type}`, e);
						result.value = '转换出错';
					}
				} else {
					result.value = '';
				}
			},
			asInput(val) {
				this.inputText = val;
				this.processInput();
			}
		},
		mounted() {
			this.processInput();
		}
	})
	.use(PrimeVue.Config, {
		theme: {
			preset: PrimeUIX.Themes.Aura
		}
	})
	.mount('main');
</script>
</body>
</html>

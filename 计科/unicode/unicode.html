<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unicode</title>

<link href="../../lib/element-plus/2.10.7/index.css" rel="stylesheet">
<link href="../../resources/el-plus.css" rel="stylesheet">
<link href="../../resources/common.css?v=250821" rel="stylesheet">
<link href="../../resources/layout.css?v=0821" rel="stylesheet">
<link href="../../resources/biz.css?v=250821" rel="stylesheet">
<link href="../../resources/花活.css" rel="stylesheet">
<style>
	.plane {
		margin-bottom: 2em;
	}
	.el-card__header {
		padding: 10px 15px;
	}
	.el-card__body {
		padding: 15px;
	}
	.el-card small {
		color: #999;
	}
</style>
</head>
<body class="grid 反叵字形">
<main id="app" v-cloak>
	<article>
		<el-card v-for="(plane,planeIndex) in planes" :key="plane.name_en" class="plane">
			<template #header>
				<h2>平面{{planeIndex}}：{{ plane.name_zh }} <small>{{ plane.name_en }}</small></h2>
				<p><b>范围:</b> {{ plane.range }}</p>
				<p>{{ plane.intro_zh }}</p>
			</template>
			<el-row :gutter="12">
				<el-col :xs="12" :sm="8" :md="6" v-for="(block,blockIndex) in plane.blocks" :key="block.name_en" style="margin-bottom: 12px;">
					<el-card>
						<template #header>
							<div>
								<span>{{ block.name_zh }}</span>
								<br>
								<small>{{ block.name_en }}</small>
							</div>
						</template>
						<div><b>范围:</b> {{ block.range }}</div>
					</el-card>
				</el-col>
			</el-row>
		</el-card>
	</article>
</main>

<aside class="right-sidebar">
</aside>

<div class="js container">
	<script src="../../lib/vue/3.5.18/vue.global.js"></script>
	<script src="../../lib/element-plus/2.10.7/index.full.js"></script>
	<script src="../../resources/util.js?v=250801"></script>
	<script src="../../resources/biz-util.js?v=250801"></script>
	</div>

					{ name_en: 'IPA Extensions', name_zh: '国际音标扩展', range: 'U+0250–U+02AF' },

			{ name_en: 'Plane 8 (unassigned)', range: 'U+80000-U+8FFFF', name_zh: '第8平面（未分配）', intro_zh: '', intro_en: '', blocks: [] },
			{ name_en: 'Plane 9 (unassigned)', range: 'U+90000-U+9FFFF', name_zh: '第9平面（未分配）', intro_zh: '', intro_en: '', blocks: [] },
			{ name_en: 'Plane 10 (unassigned)', range: 'U+A0000-U+AFFFF', name_zh: '第10平面（未分配）', intro_zh: '', intro_en: '', blocks: [] },

			{ name_en: 'Private Use Area-B (PUA-B)', range: 'U+100000-U+10FFFF', name_zh: '私人使用区B', intro_zh: '供用户自行定义和使用字符。', intro_en: 'For private use, for users to define their own characters.', blocks: [] }

	createApp({
		data() {
			return {
				planes: unicodeData.planes
			}
		}
	}).use(ElementPlus).mount('main');

</body>
</html>

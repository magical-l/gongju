<!DOCTYPE html>
<html lang="zh-CN" itemscope itemtype="http://schema.org/WebPage">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title itemprop="name">中国象棋 | 工具兽 - 在线玩经典的棋类游戏</title>

<link href="../lib/element-plus/2.10.7/index.css" rel="stylesheet">
<link href="../resources/el-plus.css" rel="stylesheet">
<link href="../resources/common.css?v=250821" rel="stylesheet">
<link href="../resources/layout.css?v=0821" rel="stylesheet">
<link href="../resources/biz.css?v=250821" rel="stylesheet">
<link href="../resources/花活.css?v=250821" rel="stylesheet">
<style>
	.chess.board {
		--min-cell-len: 60px;
		--line-color: #333;
		grid-template-rows: repeat(10, var(--min-cell-len));
		grid-template-columns: repeat(9, var(--min-cell-len));
		background-color: aliceblue;
	}

	.cell {
		position: relative;
	}

	.cell .texture {
		width: 100%;
		height: 100%;
		display: grid;
		grid-template-rows: 50% 50%;
		grid-template-columns: 50% 50%;
	}

	.cell .texture.part {
		position: relative;
		border: 0 solid var(--line-color);
	}

	/* 普通格子的线 */
	.cell .texture.part.left {
		border-right-width: 1px;
	}

	.cell .texture.part.right {
		border-left-width: 1px;
	}

	.cell .texture.part.top {
		border-bottom-width: 1px;
	}

	.cell .texture.part.bottom {
		border-top-width: 1px;
	}

	/* 第一行、最后一行、河上下沿 */
	.row-1 .texture.part.top, .row-10 .texture.part.bottom,
	.row-5:not(.红九路):not(.红一路) .texture.part.bottom,
	.row-6:not(.红九路):not(.红一路) .texture.part.top {
		border-left-width: 0;
		border-right-width: 0;
	}

	/* 最左列、最右列 */
	.红九路 .texture.part.left, .红一路 .texture.part.right {
		border-top-width: 0;
		border-bottom-width: 0;
	}

	/* 炮位、兵卒位 */
	.炮位 .texture.part::after, .兵卒位 .texture.part::after {
		position: absolute;
		width: 60%;
		height: 60%;
		border: 0 solid var(--line-color);
		content: '';
	}

	.炮位 .texture.part.left::after, .兵卒位:not(.红九路) .texture.part.left::after {
		left: 20%;
		border-right-width: 1px;
	}

	.炮位 .texture.part.right::after, .兵卒位:not(.红一路) .texture.part.right::after {
		left: 20%;
		border-left-width: 1px;
	}

	.炮位 .texture.part.top::after, .兵卒位 .texture.part.top::after {
		top: 20%;
		border-bottom-width: 1px;
	}

	.炮位 .texture.part.bottom::after, .兵卒位 .texture.part.bottom::after {
		top: 20%;
		border-top-width: 1px;
	}

	.红九路.兵卒位 .texture.part.left.top::after, .红九路.兵卒位 .texture.part.left.bottom::after,
	.红一路.兵卒位 .texture.part.right.top::after, .红一路.兵卒位 .texture.part.right.bottom::after {
		border: 0;
	}

	.row-1.红六路 .texture.part.right.bottom::after, .row-3.红四路 .texture.part.left.top::after,
	.row-2.红五路 .texture.part.left.top::after, .row-2.红五路 .texture.part.right.bottom::after,
	.row-8.红六路 .texture.part.right.bottom::after, .row-10.红四路 .texture.part.left.top::after,
	.row-9.红五路 .texture.part.left.top::after, .row-9.红五路 .texture.part.right.bottom::after {
		position: absolute;
		top: 0;
		left: 0;
		width: calc(var(--sqrt2) * var(--min-cell-len) / 2);
		height: 1px;
		background-color: var(--line-color);
		transform: rotate(45deg);
		transform-origin: top left;
		content: '';
	}

	.row-1.红四路 .texture.part.left.bottom::after, .row-3.红六路 .texture.part.right.top::after,
	.row-2.红五路 .texture.part.right.top::after, .row-2.红五路 .texture.part.left.bottom::after,
	.row-8.红四路 .texture.part.left.bottom::after, .row-10.红六路 .texture.part.right.top::after,
	.row-9.红五路 .texture.part.right.top::after, .row-9.红五路 .texture.part.left.bottom::after {
		position: absolute;
		/*top: 0;*/
		/*right: 0;*/
		/*width: calc(var(--sqrt2) * var(--cell-len) / 2);*/
		width:100%;
		height: 100%;
		/*background-color: var(--line-color);*/
		/*transform: rotate(-45deg);*/
		/*transform-origin: top right;*/
		background:
				linear-gradient(to bottom right,
				transparent calc(50% - 0.5px),
				#333 calc(50% - 0.5px),
				#333 calc(50% + 0.5px),
				transparent calc(50% + 0.5px)),
				linear-gradient(to bottom left,
				transparent calc(50% - 0.5px),
				#333 calc(50% - 0.5px),
				#333 calc(50% + 0.5px),
				transparent calc(50% + 0.5px));
		content: '';
	}
</style>
</head>
<body class="grid 反叵字形">
<main>
	<article class="game-wrapper , 反叵字形 grid" v-cloak>
		<article class="chess board , grid">
			<template v-for="r in 10">
				<div class="cell" v-for="c in 9" :class="cellClasses(r,c)">
					<div class="texture">
						<div class="texture part left top"></div>
						<div class="texture part right top"></div>
						<div class="texture part left bottom"></div>
						<div class="texture part right bottom"></div>
					</div>
					<div class="position"></div>
				</div>
			</template>
		</article>
	</article>
</main>

<div class="js container">
	<script src="../resources/math.js"></script>
	<script src="../lib/jquery-3.4.1.min.js"></script>
	<script src="../lib/toastr.min.js"></script>
	<script src="../resources/util.js"></script>
	<script src="../lib/vue/3.5.18/vue.global.js"></script>
	<script src="../lib/element-plus/2.10.7/index.full.js"></script>
	<script src="../lib/element-plus/icons-vue/2.3.1/index.iife.min.js"></script>
</div>
<script>
	const {createApp} = Vue;

	const app = createApp({
		data() {
			return {};
		},
		methods: {
			cellClasses(r, c) {
				const rt = [`row-` + r, `红` + ChineseNum.digitsFromArabic(10 - c) + `路`, `黑${c}路`];
				if ((r === 3 || r === 8) && (c === 2 || c === 8)) {
					rt.push('炮位');
				}
				if ((r === 4 || r === 7) && c % 2 === 1) {
					rt.push('兵卒位');
				}
				if ((r <= 3 || r >= 8) && (c >= 4 && c <= 6)) {
					rt.push('九宫');
					if ((r === 2 || r === 9) && c === 5) {
						rt.push('窝心');
					}
					if ((r === 3 || r === 8) && (c === 4 || c === 6)) {
						rt.push('士角');
					}
				}
				return rt;
			}
		}
	});

	app.use(ElementPlus);
	for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
		app.component(key, component);
	}
	app.mount('main>article');
</script>
</body>
</html>

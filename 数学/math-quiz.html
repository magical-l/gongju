<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧮 数学小达人</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #fff9e6 0%, #ffe4f3 50%, #e0f0ff 100%);
  font-family: "Comic Sans MS", "Chalkboard SE", "Arial Rounded MT Bold", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.quiz-card {
  width: 100%;
  max-width: 620px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(6px);
  border-radius: 32px;
  padding: 36px 32px 32px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.10);
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* 装饰小圆点 */
.quiz-card::before {
  content: "🌟⭐🌟⭐🌟";
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  letter-spacing: 12px;
  opacity: 0.5;
  pointer-events: none;
}

h1 {
  font-size: 32px;
  color: #ff6b9d;
  margin-bottom: 6px;
  letter-spacing: 2px;
}

.subtitle {
  font-size: 16px;
  color: #888;
  margin-bottom: 18px;
}

/* 设置行 */
.settings-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
  font-size: 16px;
  color: #666;
}

.settings-row label {
  font-weight: bold;
  color: #888;
}

.settings-row input {
  width: 64px;
  height: 38px;
  font-size: 18px;
  text-align: center;
  border: 2px solid #d0d9e8;
  border-radius: 10px;
  outline: none;
  font-family: inherit;
  color: #333;
}

.settings-row input:focus {
  border-color: #c084fc;
  box-shadow: 0 0 0 3px rgba(192,132,252,0.15);
}

.setting-hint {
  font-size: 13px;
  color: #aaa;
}

.quiz-problems {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 24px;
}

.problem-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 22px;
  padding: 10px 12px;
  background: #f8faff;
  border-radius: 14px;
  transition: background 0.2s;
}

.problem-row.wrong {
  background: #fff0f0;
}

.problem-row.correct {
  background: #f0fff4;
}

.problem-text {
  font-size: 16px;
  font-weight: bold;
  color: #bbb;
  min-width: 26px;
  text-align: right;
  flex-shrink: 0;
}

.problem-expr {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-weight: bold;
  color: #333;
  flex-wrap: wrap;
}

.problem-expr input {
  width: 86px;
  height: 44px;
  font-size: 22px;
  text-align: center;
  border: 2.5px solid #d0d9e8;
  border-radius: 12px;
  outline: none;
  font-family: inherit;
  font-weight: bold;
  color: #333;
  background: white;
  transition: border-color 0.2s;
}

.problem-expr input:focus {
  border-color: #ff6b9d;
  box-shadow: 0 0 0 3px rgba(255,107,157,0.15);
}

.problem-expr input.correct-answer {
  border-color: #34d399;
  background: #f0fff4;
}

.problem-expr input.wrong-answer {
  border-color: #f87171;
  background: #fff5f5;
}

.problem-status {
  width: 28px;
  font-size: 20px;
  text-align: center;
  flex-shrink: 0;
}

.actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 4px;
}

.btn {
  padding: 12px 36px;
  font-size: 20px;
  font-weight: bold;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.1s, box-shadow 0.15s;
}

.btn:active {
  transform: scale(0.96);
}

.btn-grade {
  background: linear-gradient(135deg, #ff6b9d, #c084fc);
  color: white;
  box-shadow: 0 4px 14px rgba(255,107,157,0.35);
}

.btn-grade:hover {
  box-shadow: 0 6px 20px rgba(255,107,157,0.45);
}

.btn-grade:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  box-shadow: none;
}

.btn-reset {
  background: #eef2f7;
  color: #555;
}

.btn-reset:hover {
  background: #e2e8f0;
}

/* 结果弹窗 */
.result-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
  padding: 20px;
}

.result-overlay.show {
  display: flex;
}

.result-card {
  background: white;
  border-radius: 28px;
  padding: 36px 28px 28px;
  max-width: 440px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.18);
  animation: pop-in 0.35s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes pop-in {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.result-icon {
  font-size: 60px;
  margin-bottom: 8px;
}

.result-title {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 8px;
}

.result-title.perfect {
  color: #f59e0b;
}

.result-title.has-errors {
  color: #f87171;
}

.result-msg {
  font-size: 17px;
  color: #666;
  margin-bottom: 18px;
  line-height: 1.6;
}

.result-details {
  text-align: left;
  font-size: 16px;
  color: #555;
  margin-bottom: 20px;
  padding: 0 8px;
  line-height: 1.8;
}

.result-btn {
  padding: 10px 32px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  font-family: inherit;
  color: white;
}

.result-btn.gold {
  background: linear-gradient(135deg, #f59e0b, #f97316);
}

.result-btn.pink {
  background: linear-gradient(135deg, #ff6b9d, #c084fc);
}

/* 彩色星星撒花 */
.confetti-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 200;
  overflow: hidden;
}

.confetti {
  position: absolute;
  width: 12px;
  height: 12px;
  top: -20px;
  animation: confetti-fall linear forwards;
}

@keyframes confetti-fall {
  0% {
    transform: translateY(0) rotate(0deg) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) rotate(720deg) scale(0.3);
    opacity: 0;
  }
}

/* 分数条 */
.score-bar {
  margin: 16px 0 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 18px;
  color: #666;
}

.score-bar .score-num {
  font-size: 32px;
  font-weight: bold;
  color: #ff6b9d;
}

/* 响应式 */
@media (max-width: 480px) {
  .quiz-card { padding: 24px 16px 20px; }
  h1 { font-size: 26px; }
  .settings-row { font-size: 14px; gap: 6px; flex-wrap: wrap; }
  .problem-text { font-size: 14px; min-width: 22px; }
  .problem-expr input { width: 64px; height: 38px; font-size: 18px; }
  .btn { padding: 10px 24px; font-size: 17px; }
}
</style>
</head>
<body>

<div class="quiz-card" id="app">
  <h1>🧮 数学小达人</h1>
  <p class="subtitle" id="subtitle">两位数加减法 · 一共 10 题</p>

  <div class="settings-row">
    <label for="count-input">题目数量</label>
    <input type="number" id="count-input" min="5" max="30" value="10">
    <span class="setting-hint">5 ~ 30 题</span>
  </div>

  <div class="quiz-problems" id="problems-container"></div>

  <div class="score-bar">
    <span>得分</span>
    <span class="score-num" id="score-display">—</span>
    <span>/ <span id="score-total">100</span></span>
  </div>

  <div class="actions">
    <button class="btn btn-grade" id="grade-btn">📋 批卷</button>
    <button class="btn btn-reset" id="reset-btn">🔄 重新出题</button>
  </div>
</div>

<!-- 结果弹窗 -->
<div class="result-overlay" id="result-overlay">
  <div class="result-card" id="result-card">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-details" id="result-details"></div>
    <button class="result-btn" id="result-btn">👍 知道了</button>
  </div>
</div>

<div class="confetti-container" id="confetti-container"></div>

<script>
// ── 工具 ──────────────────────────────────────
function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function pick(arr) {
  return arr[rand(0, arr.length - 1)];
}

// ── 知识点注册表 ──────────────────────────────
// gen() → { tokens: string[], answerIndex: number, blankable: number[] }
//   tokens[answerIndex] 是数值答案（由程序算出，绝不硬编码）
//   blankable 是可被挖空的数值 token 下标（不含答案位）
const TOPICS = {
  add10: { name: '10以内加法', grade: '一上', gen() {
    const a = rand(1, 9), b = rand(1, 10 - a);
    return { tokens: [String(a), '+', String(b), '=', String(a + b)], answerIndex: 4, blankable: [0, 2] };
  } },
  sub10: { name: '10以内减法', grade: '一上', gen() {
    const a = rand(2, 10), b = rand(1, a - 1);
    return { tokens: [String(a), '−', String(b), '=', String(a - b)], answerIndex: 4, blankable: [0, 2] };
  } },
  addCarry20: { name: '20以内进位加', grade: '一上', gen() {
    const a = rand(5, 9), b = rand(11 - a, 9);
    return { tokens: [String(a), '+', String(b), '=', String(a + b)], answerIndex: 4, blankable: [0, 2] };
  } },
  subBorrow20: { name: '20以内退位减', grade: '一下', gen() {
    const a = rand(11, 18), u = a % 10, b = rand(u + 1, 9);
    return { tokens: [String(a), '−', String(b), '=', String(a - b)], answerIndex: 4, blankable: [0, 2] };
  } },
  add100: { name: '两位数加法', grade: '一下', gen() {
    const a = rand(10, 99), b = rand(10, 99);
    return { tokens: [String(a), '+', String(b), '=', String(a + b)], answerIndex: 4, blankable: [0, 2] };
  } },
  sub100: { name: '两位数减法', grade: '一下', gen() {
    const a = rand(11, 99), b = rand(10, a - 1);
    return { tokens: [String(a), '−', String(b), '=', String(a - b)], answerIndex: 4, blankable: [0, 2] };
  } },
  mulTable: { name: '表内乘法', grade: '二上', gen() {
    const a = rand(2, 9), b = rand(2, 9);
    return { tokens: [String(a), '×', String(b), '=', String(a * b)], answerIndex: 4, blankable: [0, 2] };
  } },
  mulAddSub: { name: '乘加乘减', grade: '二上', gen() {
    const a = rand(2, 9), b = rand(2, 9);
    if (Math.random() < 0.5) {
      const c = rand(1, 9);
      return { tokens: [String(a), '×', String(b), '+', String(c), '=', String(a * b + c)], answerIndex: 6, blankable: [0, 2, 4] };
    }
    const c = rand(1, a * b - 1);
    return { tokens: [String(a), '×', String(b), '−', String(c), '=', String(a * b - c)], answerIndex: 6, blankable: [0, 2, 4] };
  } },
  chain100: { name: '100以内连加连减', grade: '二上', gen() {
    let a, b, c, op1, op2, mid, ans;
    do {
      a = rand(10, 60); b = rand(5, 40); c = rand(5, 40);
      op1 = Math.random() < 0.5 ? '+' : '−';
      op2 = Math.random() < 0.5 ? '+' : '−';
      mid = op1 === '+' ? a + b : a - b;
      ans = op2 === '+' ? mid + c : mid - c;
    } while (mid < 0 || mid > 100 || ans < 0 || ans > 100);
    return { tokens: [String(a), op1, String(b), op2, String(c), '=', String(ans)], answerIndex: 6, blankable: [0, 2, 4] };
  } },
  divTable: { name: '表内除法', grade: '二下', gen() {
    const b = rand(2, 9), c = rand(2, 9), a = b * c;
    return { tokens: [String(a), '÷', String(b), '=', String(c)], answerIndex: 4, blankable: [0, 2] };
  } },
  divRemainder: { name: '有余数除法', grade: '二下', gen() {
    const b = rand(2, 9), q = rand(2, 9), r = rand(1, b - 1), a = b * q + r;
    return { tokens: [String(a), '÷', String(b), '=', String(q), '…', String(r)], answerIndex: 4, blankable: [0, 2] };
  } },
  addSub10000: { name: '万以内加减', grade: '二下', gen() {
    if (Math.random() < 0.5) {
      const a = rand(100, 9000), b = rand(100, 9000);
      return { tokens: [String(a), '+', String(b), '=', String(a + b)], answerIndex: 4, blankable: [0, 2] };
    }
    const a = rand(1000, 9999), b = rand(100, a - 1);
    return { tokens: [String(a), '−', String(b), '=', String(a - b)], answerIndex: 4, blankable: [0, 2] };
  } },
  mulMulti1: { name: '多位数乘一位数', grade: '三上', gen() {
    const a = rand(12, 999), b = rand(2, 9);
    return { tokens: [String(a), '×', String(b), '=', String(a * b)], answerIndex: 4, blankable: [0, 2] };
  } },
  mul2x2: { name: '两位数乘两位数', grade: '三下', gen() {
    const a = rand(11, 99), b = rand(11, 99);
    return { tokens: [String(a), '×', String(b), '=', String(a * b)], answerIndex: 4, blankable: [0, 2] };
  } },
  divMulti1: { name: '除数是一位数的除法', grade: '三下', gen() {
    const b = rand(2, 9), c = rand(11, 99), a = b * c;
    return { tokens: [String(a), '÷', String(b), '=', String(c)], answerIndex: 4, blankable: [0, 2] };
  } },
};

// ── 难度档（知识点 id 的集合）────────────────
const LEVELS = {
  g1a: { name: '一年级上', topics: ['add10', 'sub10', 'addCarry20'] },
  g1b: { name: '一年级下', topics: ['subBorrow20', 'add100', 'sub100'] },
  g2a: { name: '二年级上', topics: ['mulTable', 'mulAddSub', 'chain100'] },
  g2b: { name: '二年级下', topics: ['divTable', 'divRemainder', 'addSub10000'] },
  g3a: { name: '三年级上', topics: ['mulMulti1', 'addSub10000'] },
  g3b: { name: '三年级下', topics: ['mul2x2', 'divMulti1'] },
};
const DEFAULT_LEVEL = 'g1b';

// ── 出题 ──────────────────────────────────────
/** pool: 知识点 id 数组；types: { result, blank } —— 返回题目数组 */
function generateSession(pool, count, types) {
  const problems = [];
  for (let i = 0; i < count; i++) {
    const topic = pick(pool);
    const spec = TOPICS[topic].gen();
    let answerIndex = spec.answerIndex;
    if (types.blank && (!types.result || Math.random() < 0.5)) {
      answerIndex = pick(spec.blankable);
    }
    problems.push({ topic, tokens: spec.tokens, answerIndex });
  }
  return problems;
}

/** 题目显示文本（答案位显示为 □），用于错题本 */
function problemText(p) {
  return p.tokens.map((t, i) => (i === p.answerIndex ? '□' : t)).join(' ');
}

/** 题目正确答案 */
function problemAnswer(p) {
  return Number(p.tokens[p.answerIndex]);
}

// ── 状态 ──────────────────────────────────────
let problems = [];
let graded = false;
let isRedo = false;      // 本轮是否「重做错题」
let startTime = 0;       // 本轮开始时间戳
let lastStats = null;    // 批卷后统计（Task 3 填）

// ── DOM 引用 ──────────────────────────────────
const container = document.getElementById('problems-container');
const gradeBtn = document.getElementById('grade-btn');
const resetBtn = document.getElementById('reset-btn');
const scoreDisplay = document.getElementById('score-display');
const scoreTotal = document.getElementById('score-total');
const subtitle = document.getElementById('subtitle');
const countInput = document.getElementById('count-input');
const overlay = document.getElementById('result-overlay');
const resultIcon = document.getElementById('result-icon');
const resultTitle = document.getElementById('result-title');
const resultMsg = document.getElementById('result-msg');
const resultDetails = document.getElementById('result-details');
const resultBtn = document.getElementById('result-btn');
const confettiContainer = document.getElementById('confetti-container');

// ── 渲染题目 ──────────────────────────────────
function render() {
  container.innerHTML = '';
  problems.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'problem-row';
    row.id = `row-${i}`;

    const label = document.createElement('span');
    label.className = 'problem-text';
    label.textContent = `${i + 1}.`;

    const expr = document.createElement('span');
    expr.className = 'problem-expr';
    p.tokens.forEach((tok, ti) => {
      if (ti === p.answerIndex) {
        const input = document.createElement('input');
        input.type = 'number';
        input.id = `input-${i}`;
        input.placeholder = '?';
        input.autocomplete = 'off';
        expr.appendChild(input);
      } else {
        const span = document.createElement('span');
        span.textContent = tok;
        expr.appendChild(span);
      }
    });

    const status = document.createElement('span');
    status.className = 'problem-status';
    status.id = `status-${i}`;

    row.appendChild(label);
    row.appendChild(expr);
    row.appendChild(status);
    container.appendChild(row);
  });

  gradeBtn.disabled = false;
  gradeBtn.textContent = '📋 批卷';
}

// ── 批卷 ──────────────────────────────────────
function grade() {
  if (graded) return;

  let correctCount = 0;
  const wrongList = [];

  problems.forEach((p, i) => {
    const input = document.getElementById(`input-${i}`);
    const status = document.getElementById(`status-${i}`);
    const row = document.getElementById(`row-${i}`);
    const filled = input.value.trim() !== '';
    const val = Number(input.value);
    const isCorrect = filled && val === problemAnswer(p);

    if (isCorrect) {
      correctCount++;
      status.textContent = '✅';
      input.className = 'correct-answer';
      row.className = 'problem-row correct';
    } else {
      status.textContent = '❌';
      input.className = 'wrong-answer';
      row.className = 'problem-row wrong';
      wrongList.push({ index: i, problem: p, given: filled ? val : '未填' });
    }

    input.disabled = true;
  });

  graded = true;
  gradeBtn.disabled = true;
  scoreDisplay.textContent = correctCount * 10;

  showResult(correctCount, wrongList);
}

// ── 显示结果 ──────────────────────────────────
function showResult(correctCount, wrongList) {
  if (correctCount === problems.length) {
    resultIcon.textContent = '🏆';
    resultTitle.textContent = '🎉 全部正确！太棒啦！🎉';
    resultTitle.className = 'result-title perfect';
    resultMsg.textContent = '你真是数学小天才！👏 快让爸爸妈妈看看你的成绩！';
    resultDetails.innerHTML = '';
    resultBtn.className = 'result-btn gold';
    resultBtn.textContent = '🌟 再来一次';
    launchConfetti();
  } else {
    resultIcon.textContent = '📝';
    resultTitle.textContent = `答对 ${correctCount} 题，继续加油！`;
    resultTitle.className = 'result-title has-errors';
    resultMsg.textContent = '错题在这里，看看正确答案吧 👇';

    let html = '';
    wrongList.forEach(w => {
      html += `<div>第 ${w.index + 1} 题：${problemText(w.problem)} → <strong>${problemAnswer(w.problem)}</strong>（你填了 ${w.given}）</div>`;
    });
    resultDetails.innerHTML = html;

    resultBtn.className = 'result-btn pink';
    resultBtn.textContent = '👍 知道了';
  }

  overlay.classList.add('show');
}

// ── 撒花动画 ──────────────────────────────────
function launchConfetti() {
  const colors = ['#ff6b9d', '#fbbf24', '#34d399', '#60a5fa', '#c084fc', '#fb923c'];
  const shapes = ['★', '●', '▲', '♦', '♥', '✦'];

  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = shapes[rand(0, shapes.length - 1)];
    el.style.left = rand(0, 100) + '%';
    el.style.color = colors[rand(0, colors.length - 1)];
    el.style.fontSize = rand(14, 28) + 'px';
    el.style.animationDuration = (rand(15, 35) / 10) + 's';
    el.style.animationDelay = (rand(0, 30) / 10) + 's';
    confettiContainer.appendChild(el);
  }

  setTimeout(() => { confettiContainer.innerHTML = ''; }, 5000);
}

// ── 题目来源（Task 1 降级版，Task 2 替换为设置 UI 版本）────
function currentPool() { return LEVELS[DEFAULT_LEVEL].topics; }
function currentTypes() { return { result: true, blank: false }; }

// ── 重置 ──────────────────────────────────────
function resetQuiz() {
  const count = parseInt(countInput.value, 10) || 10;
  const clamped = Math.max(5, Math.min(30, count));
  countInput.value = clamped;

  problems = generateSession(currentPool(), clamped, currentTypes());
  graded = false;
  isRedo = false;
  startTime = Date.now();
  overlay.classList.remove('show');
  confettiContainer.innerHTML = '';
  scoreDisplay.textContent = '—';
  scoreTotal.textContent = clamped * 10;
  render();
  document.getElementById('input-0')?.focus();
}

// ── 事件绑定 ──────────────────────────────────
gradeBtn.addEventListener('click', grade);

resetBtn.addEventListener('click', resetQuiz);
countInput.addEventListener('change', resetQuiz);

resultBtn.addEventListener('click', () => {
  if (resultBtn.textContent === '🌟 再来一次') {
    overlay.classList.remove('show');
    resetQuiz();
  } else {
    overlay.classList.remove('show');
  }
});

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.remove('show');
});

// 回车跳转到下一题
container.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const input = e.target;
    if (input.tagName === 'INPUT') {
      const idx = parseInt(input.id.replace('input-', ''), 10);
      if (graded) return;
      if (idx < problems.length - 1) {
        document.getElementById(`input-${idx + 1}`)?.focus();
      } else {
        // 最后一题回车 → 批卷
        grade();
      }
    }
  }
});

// ── 启动 ──────────────────────────────────────
resetQuiz();
</script>
</body>
</html>

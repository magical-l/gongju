<!DOCTYPE html>
<html lang="zh-CN" itemscope itemtype="http://schema.org/WebPage">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title itemprop="name">中国象棋 | 工具兽 - 在线玩经典的棋类游戏</title>

<link href="../../lib/element-plus/2.10.7/index.css" rel="stylesheet">
<link href="../../resources/el-plus.css" rel="stylesheet">
<link href="../../resources/common.css?v=250821" rel="stylesheet">
<link href="../../resources/layout.css?v=0821" rel="stylesheet">
<link href="../../resources/biz.css?v=250821" rel="stylesheet">
<link href="../../resources/花活.css?v=250821" rel="stylesheet">
<style>
	.chess.board {
		--min-cell-len: 60px;
		--line-color: #333;
		grid-template-rows: repeat(10, var(--min-cell-len));
		grid-template-columns: repeat(9, var(--min-cell-len));
		background-color: aliceblue;
	}

	.cell {
		position: relative;
		display: flex;
		justify-content: center;
		align-items: center;
	}

	.cell .texture.container {
		position: absolute;
		width: 100%;
		height: 100%;
		z-index: 1;
	}

	.cell .texture.part {
		position: absolute;
		width: 100%;
		height: 100%;
	}

	.cell .texture.part.left {
		left: 0;
	}

	.cell .texture.part.right {
		left: 50%;
	}

	.cell .texture.part.top {
		top: 0;
	}

	.cell .texture.part.bottom {
		top: 50%;
	}

	/* 普通格子的线 */
	.cell .texture.part.left, .cell .texture.part.right {
		width: 50%;
		background: url('h-line.svg') center;
	}

	.cell .texture.part.top, .cell .texture.part.bottom {
		height: 50%;
		background: url('v-line.svg') center;
	}

	/* 炮位、兵卒位 */
	.炮位.cell .texture.part.corner, .兵卒位:not(.红九路) .texture.part.corner, .兵卒位:not(.红一路) .texture.part.corner {
		background: url('折线.svg');
	}

	.cell .texture.part.corner, /* 边角 */
	.row-1.cell .texture.part.top, /* 第一行上部 */
	.row-10.cell .texture.part.bottom, /* 最后一行下部 */
	.row-5.cell:not(.红九路):not(.红一路) .texture.part.bottom, /* 河上沿中段下部 */
	.row-6.cell:not(.红九路):not(.红一路) .texture.part.top, /* 河下沿中段上部 */
	.红九路.cell .texture.part.left, /* 最左列左部 */
	.红一路.cell .texture.part.right /* 最右列右部 */ {
		background: none;
	}

	.炮位.cell .texture.part.right.top, .兵卒位.cell .texture.part.right.top {
		rotate: 90deg;
	}

	.炮位.cell .texture.part.right.bottom, .兵卒位.cell .texture.part.right.bottom {
		rotate: 180deg;
	}

	.炮位.cell .texture.part.left.bottom, .兵卒位.cell .texture.part.left.bottom {
		rotate: 270deg;
	}

	/* 九宫 左上-右下斜线 */
	.row-1.红六路.cell .texture.part.right.bottom, .row-3.红四路.cell .texture.part.left.top,
	.row-2.红五路.cell .texture.part.left.top, .row-2.红五路.cell .texture.part.right.bottom,
	.row-8.红六路.cell .texture.part.right.bottom, .row-10.红四路.cell .texture.part.left.top,
	.row-9.红五路.cell .texture.part.left.top, .row-9.红五路.cell .texture.part.right.bottom {
		background: url('left-top-to-right-bottom.svg');
	}

	/* 九宫 右上-左下斜线 */
	.row-1.红四路.cell .texture.part.left.bottom, .row-3.红六路.cell .texture.part.right.top,
	.row-2.红五路.cell .texture.part.right.top, .row-2.红五路.cell .texture.part.left.bottom,
	.row-8.红四路.cell .texture.part.left.bottom, .row-10.红六路.cell .texture.part.right.top,
	.row-9.红五路.cell .texture.part.right.top, .row-9.红五路.cell .texture.part.left.bottom {
		background: url('left-bottom-to-right-top.svg');
	}

	/* 棋子样式 */
	.piece {
		position: relative;
		z-index: 10;
		width: 80%;
		height: 80%;
		border-radius: 50%;
		display: flex;
		justify-content: center;
		align-items: center;
		font-size: calc(var(--min-cell-len) * 0.5);
		font-weight: bold;
		cursor: pointer;
		box-shadow: 0 2px 4px rgba(0, 0, 0, .3);
	}

	.piece.red {
		background-color: #fdd;
		border: 2px solid #d43d3d;
		color: #d43d3d;
	}

	.piece.black {
		background-color: #eee;
		border: 2px solid #333;
		color: #333;
	}

	.piece.selected {
		border-color: #007bff;
		box-shadow: 0 0 10px 3px #007bff;
	}

	.valid-move-indicator {
		position: absolute;
		z-index: 20;
		width: 40%;
		height: 40%;
		background-color: rgba(40, 167, 69, 0.5);
		border-radius: 50%;
	}
</style>
</head>
<body class="grid 反叵字形">
<main>
	<article class="game-wrapper , 反叵字形 grid" v-cloak>
		<article class="chess board , grid">
			<template v-for="r in 10">
				<div class="cell" v-for="c in 9" :class="cellClasses(r,c)" @click="handleCellClick(r, c)">
					<div class="texture container">
						<div class="texture part vertical top"></div>
						<div class="texture part horizon right"></div>
						<div class="texture part vertical bottom"></div>
						<div class="texture part horizon left"></div>
						<div class="texture part left top corner"></div>
						<div class="texture part right top corner"></div>
						<div class="texture part right bottom corner"></div>
						<div class="texture part left bottom corner"></div>
					</div>
					<div v-if="getPieceAt(r,c)" :class="getPieceClasses(getPieceAt(r,c))">
						{{ getPieceAt(r, c).name }}
					</div>
					<div v-if="isValidMove(r,c)" class="valid-move-indicator"></div>
				</div>
			</template>
		</article>
	</article>
</main>

<div class="js container">
	<script src="../../resources/math.js"></script>
	<script src="../../lib/jquery-3.4.1.min.js"></script>
	<script src="../../lib/toastr.min.js"></script>
	<script src="../../resources/util.js"></script>
	<script src="../../lib/vue/3.5.18/vue.global.js"></script>
	<script src="../../lib/element-plus/2.10.7/index.full.js"></script>
	<script src="../../lib/element-plus/icons-vue/2.3.1/index.iife.min.js"></script>
	<script src="game.js"></script>
</div>
<script>
	const {createApp, reactive} = Vue;

	const app = createApp({
		data() {
			return {
				game: null,
				validMoves: []
			};
		},
		mounted() {
			// 使用Vue的reactive来包装game对象，使其内部属性（如board）的变化能够被Vue检测到
			this.game = reactive(new Game());
		},
		methods: {
			cellClasses(r, c) {
				const rt = [`row-` + r, `红` + ChineseNum.digitsFromArabic(10 - c) + `路`, `黑${c}路`];
				if ((r === 3 || r === 8) && (c === 2 || c === 8)) {
					rt.push('炮位');
				}
				if ((r === 4 || r === 7) && c % 2 === 1) {
					rt.push('兵卒位');
				}
				if ((r <= 3 || r >= 8) && (c >= 4 && c <= 6)) {
					rt.push('九宫');
					if ((r === 2 || r === 9) && c === 5) {
						rt.push('窝心');
					}
					if ((r === 3 || r === 8) && (c === 4 || c === 6)) {
						rt.push('士角');
					}
				}
				return rt;
			},
			getPieceAt(r, c) {
				return this.game?.getUnitAt(r, c);
			},
			getPieceClasses(piece) {
				if (!piece) return [];
				const classes = piece.cssClass;
				if (this.game.selectedUnit && this.game.selectedUnit.id === piece.id) {
					classes.push('selected');
				}
				return classes;
			},
			handleCellClick(r, c) {
				if (!this.game || this.game.isGameOver) return;
				// 将点击事件委托给当前回合的玩家
				this.game.currentTurn.currentPlayer.handleCellClick(r, c);

				// 更新可移动位置的显示
				if (this.game.selectedUnit) {
					this.validMoves = this.game.ruleEngine.getValidMovesForUnit(this.game.selectedUnit);
				} else {
					this.validMoves = [];
				}
			},
			isValidMove(r, c) {
				return this.validMoves.some(move => move[0] === r && move[1] === c);
			}
		}
	});

	app.use(ElementPlus);
	for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
		app.component(key, component);
	}
	app.mount('main>article');
</script>
</body>
</html>

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>export</title><style>
  :root { --cat:#5d7259;
          --glyph:"Arial","Segoe UI Emoji","Noto Sans Symbols 2","Segoe UI Symbol","Noto Sans Egyptian Hieroglyphs",sans-serif; }

  * { box-sizing:border-box; }

  .panes { height:100%; display:flex; }
  .tree { width:80px; flex:0 0 80px; border-right:1px solid #eceef1; background:#fafbfa;

  .tree .tn .tri { flex:0 0 7px; color:#b3b9bf; font-size:5.5px; font-variant-emoji:text; }
  .tree .tn.on { background:color-mix(in srgb, var(--cat) 16%, #fff); color:#2f3a2d; font-weight:700;
                 box-shadow:inset 2px 0 0 var(--cat); }
  .grid { flex:1; display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(5,1fr);
          padding:4px; gap:2px; }
  .grid .cell { display:flex; flex-direction:column; align-items:center; justify-content:center;
                border:1px solid #f1f3f1; border-radius:3px; }
  .grid .cell .g { font-size:13px; line-height:1.15; }
  .grid .cell .n { font-size:5.5px; color:#9aa1a8; line-height:1.18; width:100%; padding:0 1px;
                   max-height:13px; overflow:hidden; text-align:center; word-break:break-all; }
